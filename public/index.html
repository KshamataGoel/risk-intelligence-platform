.na-tmap-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.na-tmap-node { background:var(--surface); border:1.5px solid var(--border); border-left:4px solid var(--primary); border-radius:8px; padding:9px 13px; font-size:12px; font-weight:600; color:var(--text); box-shadow:var(--shadow); max-width:280px; text-align:center; opacity:0; animation:naNodeIn 0.45s ease forwards; }
.na-tmap-node.root { background:linear-gradient(135deg,#7f1d1d,#991b1b); color:#fff; border-color:#7f1d1d; border-left-color:#fff; max-width:none; font-weight:700; }
.na-tmap-conn { text-align:center; margin:5px 0; opacity:0; animation:naFadeIn 0.5s ease forwards; }
.na-tmap-conn::before { content:''; display:block; width:0; height:20px; margin:0 auto; border-left:2px dotted var(--primary); }
.na-tmap-conn i { color:var(--primary); font-size:12px; display:block; margin-top:-3px; }

/* Transmission map v2 — dark tiered tree with SVG dotted connectors */
.na-tmap2 { position:relative; padding:6px 2px 10px; }
.na-tmap2-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; transition:opacity 0.6s ease; overflow:visible; }
.na-tmap2-bar { position:relative; z-index:1; background:#241712; border:1.5px solid var(--primary); border-radius:10px; color:var(--primary); font-weight:600; text-align:center; padding:13px 18px; margin:30px 0; font-size:13px; opacity:0; animation:naNodeIn 0.45s ease forwards; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
.na-tmap2-bar strong { color:#fff; letter-spacing:0.5px; }
.na-tmap2-tier { position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin:38px 0; }
.na-tmap2-lbl { flex:0 0 120px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); padding-left:10px; border-left:3px solid transparent; }
.na-tmap2-lbl.accent { border-left-color:#991B1B; }
.na-tmap2-row { flex:1; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
.na-tmap2-node { position:relative; z-index:1; background:#241712; border:1px solid rgba(255,173,40,0.42); border-radius:8px; color:var(--primary); font-weight:700; font-size:12px; padding:9px 14px; box-shadow:0 1px 4px rgba(0,0,0,0.28); opacity:0; animation:naNodeIn 0.45s ease forwards; }

.sev-badge { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap; }
.sev-critical { background:#FEF2F2; color:#991B1B; border:1px solid #FCA5A5; }
.sev-high     { background:#FFF7ED; color:#C2410C; border:1px solid #FDBA74; }
.sev-medium   { background:#FFFBEB; color:#92400E; border:1px solid #FDE68A; }
.sev-low      { background:#F0FDF4; color:#15803D; border:1px solid #86EFAC; }

.scope-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-bottom:16px; }
.scope-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.scope-card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:10px; }
.scope-card-item { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--text); padding:6px 0; border-bottom:1px solid var(--border); line-height:1.4; }
.scope-card-item:last-child { border-bottom:none; }
.scope-card-item i { color:var(--primary); font-size:10px; margin-top:4px; flex-shrink:0; }

.action-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; }
.action-tab { padding:10px 20px; font-size:13px; font-weight:600; color:var(--text-2); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; font-family:inherit; transition:all 0.15s; }
.action-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.action-tab:hover:not(.active) { color:var(--text); }
.action-item { display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px; color:var(--text); line-height:1.5; }
.action-item:last-child { border-bottom:none; }
.action-bullet { width:22px; height:22px; min-width:22px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; margin-top:1px; }

.model-warning-card { background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid #FFAD28; border-radius:var(--radius); padding:20px 24px; margin-bottom:16px; }
.model-warning-title { font-size:15px; font-weight:700; color:#92400E; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.model-warning-item { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; font-size:13.5px; color:#78350F; line-height:1.5; }

.reg-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.reg-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.reg-card-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.reg-card-body { font-size:13px; color:var(--text-2); line-height:1.6; }
.reg-note { margin-top:16px; padding:10px 14px; background:var(--warning-bg); border:1px solid #FCD34D; border-radius:var(--radius-sm); font-size:12px; color:var(--warning-text); }

.scenario-library-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
.scenario-lib-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); transition:all 0.18s; position:relative; }
.scenario-lib-card.sc-active { cursor:pointer; }
.scenario-lib-card.sc-active:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); border-color:var(--primary); }
.scenario-lib-card.sc-soon { opacity:0.7; }
.scenario-lib-num { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-3); margin-bottom:8px; }
.scenario-lib-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; line-height:1.3; }
.scenario-lib-event { font-size:12px; color:var(--primary); font-weight:600; margin-bottom:10px; }
.scenario-lib-desc { font-size:13px; color:var(--text-2); line-height:1.55; margin-bottom:14px; }
.scenario-lib-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.scenario-lib-tag { background:var(--primary-light); color:var(--primary); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600; }
.scenario-lib-footer { display:flex; align-items:center; justify-content:space-between; }

/* ── Real Scenario Test ── */
.rst-event-card { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:var(--radius); padding:18px 22px; margin-bottom:20px; }
.rst-event-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.rst-event-id { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px; color:var(--primary); background:var(--primary-light); padding:2px 9px; border-radius:20px; white-space:nowrap; }
.rst-event-title { font-size:15px; font-weight:700; color:var(--text); flex:1; }
.rst-event-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; font-size:12px; color:var(--text-2); }
.rst-event-meta span { display:flex; align-items:center; gap:4px; }
.rst-event-text { background:#F8FAFC; border:1px solid rgba(0,0,0,0.08); border-radius:var(--radius-sm); padding:12px 14px; font-size:12.5px; color:var(--text-2); line-height:1.7; white-space:pre-line; margin-top:12px; max-height:180px; overflow-y:auto; }
.rst-candidate-list { display:flex; flex-direction:column; gap:14px; }
.rst-candidate { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.rst-candidate-header { display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; user-select:none; }
.rst-candidate-header:hover { background:rgba(0,0,0,0.025); }
.rst-rank-badge { width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rst-candidate-trigger { flex:1; font-size:14px; font-weight:600; color:var(--text); }
.rst-score-pill { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; }
.rst-score-high { background:rgba(16,185,129,0.12); color:#047857; }
.rst-score-med  { background:rgba(245,158,11,0.12);  color:#92400E; }
.rst-score-low  { background:rgba(239,68,68,0.12);   color:#991B1B; }
.rst-llm-badge  { padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
.rst-llm-relevant   { background:rgba(16,185,129,0.12);  color:#047857; }
.rst-llm-possibly   { background:rgba(245,158,11,0.12);  color:#92400E; }
.rst-llm-not        { background:rgba(239,68,68,0.12);   color:#991B1B; }
.rst-candidate-body { padding:0 18px 16px; border-top:1px solid var(--border); }
.rst-scores-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; padding:12px 0; }
.rst-score-item { text-align:center; }
.rst-score-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-bottom:4px; }
.rst-score-bar-wrap { height:6px; background:rgba(0,0,0,0.08); border-radius:3px; overflow:hidden; margin-bottom:3px; }
.rst-score-bar { height:100%; border-radius:3px; background:var(--primary); transition:width 0.4s ease; }
.rst-score-val { font-size:12px; font-weight:700; color:var(--text-2); }
.rst-pathway { margin-top:12px; }
.rst-pathway-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:8px; }
.rst-pathway-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.rst-pathway-item { background:#F8FAFC; border:1px solid rgba(0,0,0,0.08); border-radius:var(--radius-sm); padding:9px 12px; }
.rst-pathway-key { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-bottom:3px; }
.rst-pathway-val { font-size:12.5px; color:var(--text-2); line-height:1.55; }
.rst-llm-section { margin-top:12px; background:rgba(245,158,11,0.06); border:1px solid rgba(245,158,11,0.2); border-radius:var(--radius-sm); padding:12px 14px; }
.rst-llm-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; font-size:12.5px; }
.rst-llm-label { font-weight:700; color:var(--text-3); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:2px; }
.rst-llm-val   { color:var(--text-2); line-height:1.55; }
.rst-event-select { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:24px; }
.rst-event-list { display:flex; flex-direction:column; gap:8px; }
.rst-event-row { display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:all 0.15s; background:var(--surface); }
.rst-event-row:hover,.rst-event-row.selected { border-color:var(--primary); background:var(--primary-light); }
.rst-weight-panel { display:flex; flex-wrap:wrap; gap:12px; padding:14px 0; }
.rst-weight-item { display:flex; align-items:center; gap:8px; font-size:12.5px; }
.rst-weight-item label { color:var(--text-2); font-weight:600; min-width:120px; }

/* ── News Intelligence ── */
/* Landing two-column: live risk feed (left) + search (right) */
.ni-landing { display:flex; gap:22px; align-items:flex-start; }
.ni-home { flex:0 0 400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; position:sticky; top:0; max-height:calc(100vh - 150px); }
.ni-right { flex:1; min-width:0; }
.ni-home-head { padding:16px 18px 12px; background:linear-gradient(160deg,#1C1F1C,#2A2E2A); color:#fff; }
.ni-home-live { display:inline-flex; align-items:center; gap:7px; font-size:10px; font-weight:800; letter-spacing:1px; color:var(--primary); }
.ni-live-dot { width:8px; height:8px; border-radius:50%; background:#EF4444; box-shadow:0 0 0 0 rgba(239,68,68,0.6); animation:niPulse 1.8s infinite; }
@keyframes niPulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.55);} 70%{box-shadow:0 0 0 8px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }
.ni-home-h { font-size:18px; font-weight:800; margin-top:6px; letter-spacing:-0.3px; }
.ni-home-hsub { font-size:11.5px; color:rgba(255,255,255,0.65); margin-top:3px; line-height:1.45; }
.ni-home-filters { display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:var(--surface); }
.ni-home-filter { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:16px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); cursor:pointer; transition:all 0.15s; }
.ni-home-filter:hover { border-color:var(--primary); }
.ni-home-filter.active { background:#0F172A; color:#fff; border-color:#0F172A; }
.ni-home-filter-n { font-size:10px; font-weight:800; background:rgba(0,0,0,0.08); border-radius:10px; padding:1px 6px; }
.ni-home-filter.active .ni-home-filter-n { background:rgba(255,255,255,0.2); }
.ni-home-feed { overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:9px; }
.ni-home-card { border:1px solid var(--border); border-left:4px solid var(--border); border-radius:9px; padding:11px 13px; cursor:pointer; transition:all 0.15s; background:var(--surface); }
.ni-home-card:hover { border-color:var(--primary); box-shadow:0 3px 10px rgba(0,0,0,0.08); transform:translateY(-1px); }
.ni-home-card.nlv-severe { border-left-color:#B91C1C; }
.ni-home-card.nlv-high   { border-left-color:#EA580C; }
.ni-home-card.nlv-medium { border-left-color:#CA8A04; }
.ni-home-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.ni-sev-badge { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:2px 8px; border-radius:20px; }
.ni-sev-badge.nlv-severe { background:#FEE2E2; color:#B91C1C; }
.ni-sev-badge.nlv-high   { background:#FFEDD5; color:#C2410C; }
.ni-sev-badge.nlv-medium { background:#FEF9C3; color:#854D0E; }
.ni-home-type { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--text-3); }
.ni-home-type i { color:var(--primary); font-size:11px; }
.ni-home-card-title { font-size:13px; font-weight:700; color:var(--text); line-height:1.4; }
.ni-home-card-risk { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--primary); margin-top:7px; }
.ni-home-card-risk i { font-size:10px; }
.ni-home-card-impact { font-size:11.5px; color:var(--text-2); line-height:1.5; margin-top:5px; }
.ni-home-card-cta { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--primary); margin-top:8px; opacity:0; transition:opacity 0.15s; }
.ni-home-card:hover .ni-home-card-cta { opacity:1; }
.ni-home-card.selected { border-color:var(--primary); background:var(--primary-light); }
/* Selected-article panel (middle) */
.na-article { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; }
.na-article-top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.na-article-title { font-size:18px; font-weight:800; color:var(--text); line-height:1.35; letter-spacing:-0.3px; }
.na-article-row { display:flex; gap:12px; margin-top:14px; }
.na-article-k { flex:0 0 96px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); padding-top:2px; }
.na-article-v { flex:1; font-size:13px; color:var(--text-2); line-height:1.6; }
.na-article-note { margin-top:18px; font-size:12px; color:var(--text-2); background:#FFF7ED; border:1px solid #FDBA74; border-radius:var(--radius-sm); padding:10px 13px; line-height:1.55; }
.na-article-note i { color:var(--primary); margin-right:6px; }
.na-article.runnable { cursor:pointer; transition:border-color 0.15s, box-shadow 0.15s; }
.na-article.runnable:hover { border-color:var(--primary); box-shadow:0 4px 16px rgba(0,0,0,0.10); }
.na-article-actions { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
.na-article-hint { font-size:12px; color:var(--text-3); line-height:1.5; }
.na-article-body { margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
.na-article-text { font-size:13px; color:var(--text-2); line-height:1.7; white-space:pre-line; }
@media (max-width:980px){ .ni-landing { flex-direction:column; } .ni-home { flex-basis:auto; width:100%; position:static; max-height:520px; } }
.ni-search-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:24px; box-shadow:var(--shadow); }
.ni-search-box { display:flex; gap:10px; align-items:center; }
.ni-search-input { flex:1; padding:13px 16px 13px 44px; font-size:14px; border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; }
.ni-search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.ni-search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:15px; pointer-events:none; }
.ni-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.ni-chip { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; font-size:12.5px; font-weight:600; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text-2); cursor:pointer; transition:all 0.15s; }
.ni-chip:hover { border-color:var(--primary); background:var(--primary-light); color:var(--text); }
.ni-chip i { color:var(--primary); }
.ni-searching { display:flex; flex-direction:column; align-items:center; gap:14px; padding:44px 20px; }
.ni-searching-sources { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px; }
.ni-src-pill { font-size:11px; font-weight:600; padding:4px 11px; border-radius:20px; border:1px solid var(--border); color:var(--text-3); background:var(--surface); opacity:0.4; transition:all 0.3s; }
.ni-src-pill.hit { opacity:1; border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.ni-stage { margin-bottom:26px; }
.ni-stage-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.ni-stage-num { width:30px; height:30px; border-radius:8px; background:var(--primary); color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ni-stage-title { font-size:15px; font-weight:800; color:var(--text); }
.ni-stage-sub { font-size:12px; color:var(--text-3); }
.ni-web-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); }
.ni-web-src { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3); margin-bottom:6px; }
.ni-web-src .ni-fav { width:16px; height:16px; border-radius:4px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:9px; }
.ni-web-headline { font-size:16px; font-weight:700; color:#1a56db; margin-bottom:4px; line-height:1.4; }
.ni-web-url { font-size:12px; color:#15803D; margin-bottom:8px; }
.ni-web-snippet { font-size:13px; color:var(--text-2); line-height:1.65; }
.ni-web-cites { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.ni-cite { font-size:11px; font-weight:600; padding:3px 10px; border-radius:6px; background:#F1F5F9; color:var(--text-2); border:1px solid var(--border); }
.ni-extract-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:14px; }
.ni-extract-item { background:#F8FAFC; border:1px solid rgba(0,0,0,0.07); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:10px 13px; }
.ni-extract-key { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:4px; }
.ni-extract-val { font-size:13px; font-weight:600; color:var(--text); line-height:1.5; }
.ni-tag { display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; margin:2px 3px 2px 0; border-radius:20px; background:var(--primary-light); color:var(--primary-dark); }
.ni-cat-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
@media (max-width:820px){ .ni-cat-grid { grid-template-columns:1fr; } }
.ni-panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.ni-panel-title { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:14px; }
.ni-kv-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; }
.ni-kv-row:last-child { border-bottom:none; }
.ni-kv-key { color:var(--text-3); font-weight:600; }
.ni-kv-val { color:var(--text); font-weight:700; text-align:right; }
.ni-prio-score { text-align:center; }
.ni-prio-ring { width:118px; height:118px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:4px auto 10px; position:relative; }
.ni-prio-ring-inner { width:92px; height:92px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ni-prio-num { font-size:30px; font-weight:800; line-height:1; }
.ni-prio-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-top:3px; }
.ni-prio-bars { margin-top:8px; }
.ni-prio-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.ni-prio-bar-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-3); width:78px; flex-shrink:0; }
.ni-prio-bar-track { flex:1; height:8px; background:rgba(0,0,0,0.07); border-radius:4px; overflow:hidden; }
.ni-prio-bar-fill { height:100%; border-radius:4px; transition:width 0.6s ease; }
.ni-prio-bar-val { font-size:12px; font-weight:700; color:var(--text-2); width:34px; text-align:right; }
.ni-similar { background:linear-gradient(180deg,rgba(255,173,40,0.06),var(--surface)); border:1px solid rgba(255,173,40,0.3); border-left:4px solid var(--primary); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); }
.ni-similar-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.ni-similar-badge { font-size:11px; font-weight:800; padding:4px 11px; border-radius:20px; background:var(--primary); color:#fff; display:flex; align-items:center; gap:6px; }
.ni-similar-sim { font-size:13px; font-weight:800; color:var(--primary-dark); }
.ni-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:18px; }
.ni-kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow); border-top:3px solid var(--primary); }
.ni-kpi-icon { font-size:15px; color:var(--primary); margin-bottom:8px; }
.ni-kpi-val { font-size:22px; font-weight:800; color:var(--text); line-height:1.05; }
.ni-kpi-lbl { font-size:11px; font-weight:600; color:var(--text-3); margin-top:4px; }
.ni-kpi-delta { font-size:11px; font-weight:700; margin-top:6px; display:inline-flex; align-items:center; gap:4px; }
.ni-flow { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 2px 12px; }
.ni-flow-col { flex:1; min-width:150px; display:flex; flex-direction:column; }
.ni-flow-col-title { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); text-align:center; margin-bottom:10px; }
.ni-flow-nodes { display:flex; flex-direction:column; gap:8px; flex:1; justify-content:center; }
.ni-flow-node { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:12px; font-weight:600; color:var(--text); text-align:center; box-shadow:var(--shadow); border-left:4px solid var(--sev-color,var(--primary)); }
.ni-flow-node small { display:block; font-size:10px; font-weight:700; margin-top:2px; text-transform:uppercase; letter-spacing:0.4px; }
.ni-flow-arrow { display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:16px; padding:0 4px; flex-shrink:0; }
.ni-heat-wrap { overflow-x:auto; }
.ni-heat { border-collapse:separate; border-spacing:4px; width:100%; min-width:560px; }
.ni-heat th { font-size:11px; font-weight:700; color:var(--text-3); padding:6px 8px; text-align:center; }
.ni-heat th.ni-heat-row-h { text-align:left; min-width:130px; }
.ni-heat td { text-align:center; padding:10px 8px; border-radius:6px; font-size:13px; font-weight:700; color:#fff; }
.ni-heat td.ni-heat-row-h { color:var(--text); font-weight:700; text-align:left; background:#F1F5F9; font-size:12.5px; }
.ni-legend { display:flex; align-items:center; gap:14px; margin-top:12px; font-size:11px; color:var(--text-3); flex-wrap:wrap; }
.ni-legend-item { display:flex; align-items:center; gap:6px; }
.ni-legend-swatch { width:26px; height:12px; border-radius:3px; }
.ni-disclaimer { font-size:11.5px; color:var(--text-3); background:#F8FAFC; border:1px dashed var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin-top:18px; line-height:1.6; }

/* ── News Assessment & Impact ── */
.na-news-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; }
.na-news-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--surface); }
.na-news-table th { background:#F8FAFC; padding:11px 14px; text-align:left; font-weight:700; color:var(--text-2); border-bottom:2px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap; }
.na-news-table td { padding:12px 14px; border-bottom:1px solid var(--border); color:var(--text); vertical-align:top; line-height:1.5; }
.na-news-table tr.na-news-row { cursor:pointer; transition:background 0.15s; }
.na-news-table tr.na-news-row:hover td { background:var(--primary-light); }
.na-news-table tr.na-news-row.sel td { background:var(--primary-light); }
.na-news-date { font-weight:700; white-space:nowrap; color:var(--text-2); }
.na-news-title { font-weight:700; color:var(--text); }
.na-type-pill { display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--primary-light); color:var(--primary-dark); white-space:nowrap; text-transform:uppercase; letter-spacing:0.3px; }
.na-news-syn { font-size:12.5px; color:var(--text-2); max-width:520px; }
.na-src-link { font-size:12px; color:#15803D; font-weight:600; white-space:nowrap; }
.na-feed { display:flex; flex-direction:column; gap:9px; }
.na-feed-row { display:grid; grid-template-columns:88px 1.5fr 158px 2.6fr 100px 26px; gap:14px; align-items:center; padding:13px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all 0.15s; box-shadow:var(--shadow); }
.na-feed-row:hover { border-color:var(--primary); background:var(--primary-light); transform:translateX(3px); }
.na-feed-date { font-size:12.5px; font-weight:700; color:var(--text-2); white-space:nowrap; }
.na-feed-title { font-size:13.5px; font-weight:700; color:var(--text); line-height:1.3; }
.na-feed-syn { font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.na-feed-src { font-size:12px; color:#15803D; font-weight:600; white-space:nowrap; }
.na-feed-go { color:var(--primary); font-size:16px; text-align:right; }
.na-feed-row:hover .na-feed-go { transform:translateX(2px); }
.na-feed-empty { text-align:center; padding:34px 20px; color:var(--text-3); font-size:13px; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); }
.na-feed-count { font-size:12px; color:var(--text-3); margin:0 0 10px; }
.na-feed-hl { background:rgba(255,173,40,0.35); border-radius:3px; padding:0 1px; }
@media (max-width:860px){ .na-feed-row { grid-template-columns:1fr; gap:5px; } .na-feed-syn{ white-space:normal; } .na-feed-go{ display:none; } }

/* Internet-style "live search" loader */
.na-loading { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 24px; text-align:center; }
.na-loading-globe { font-size:30px; color:var(--primary); margin-bottom:14px; }
.na-loading-title { font-size:15px; font-weight:800; color:var(--text); margin-bottom:6px; }
.na-loading-sub { font-size:12.5px; color:var(--text-3); margin-bottom:18px; }
.na-loading-srcs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:560px; margin:0 auto; }
.na-src-pill { font-size:11px; font-weight:600; padding:5px 12px; border-radius:20px; border:1px solid var(--border); color:var(--text-3); background:var(--surface); opacity:0.4; transition:all 0.3s; display:flex; align-items:center; gap:6px; }
.na-src-pill.hit { opacity:1; border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.na-src-pill.hit i.chk { color:#15803D; }

/* Internet-style search results */
.na-sr { display:flex; flex-direction:column; gap:14px; }
.na-sr-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 20px; cursor:pointer; transition:all 0.15s; }
.na-sr-card:hover { border-color:var(--primary); box-shadow:var(--shadow-lg); }
.na-sr-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text-3); margin-bottom:5px; }
.na-sr-fav { width:18px; height:18px; border-radius:5px; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; }
.na-sr-url { color:#15803D; font-weight:600; }
.na-sr-dot { color:var(--border); }
.na-sr-title { font-size:17px; font-weight:700; color:#1a56db; line-height:1.35; margin-bottom:6px; }
.na-sr-card:hover .na-sr-title { text-decoration:underline; }
.na-sr-snippet { font-size:13px; color:var(--text-2); line-height:1.6; }
.na-sr-foot { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.na-sr-run { margin-left:auto; font-size:12px; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:6px; }
.na-sr-card:hover .na-sr-run { gap:9px; }

/* Live agent step execution */
.na-exec-wrap { max-width:760px; margin:0 auto; }
.na-agent-block { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
.na-agent-head { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
.na-agent-badge { width:34px; height:34px; border-radius:9px; background:var(--primary-light); color:var(--primary-dark); font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.3s; }
.na-agent-block.act .na-agent-badge { background:var(--primary); color:#fff; }
.na-agent-block.done .na-agent-badge { background:#15803D; color:#fff; }
.na-agent-name { font-size:14px; font-weight:800; color:var(--text); }
.na-agent-role { font-size:11.5px; color:var(--text-3); }
.na-agent-out { margin-left:auto; font-size:10.5px; font-weight:700; color:var(--text-3); background:#F1F5F9; border:1px solid var(--border); border-radius:20px; padding:3px 10px; white-space:nowrap; }
.na-steps { padding:8px 18px 14px; }
.na-step { display:flex; align-items:center; gap:11px; padding:7px 0; font-size:13px; color:var(--text-3); transition:color 0.2s; }
.na-step.run { color:var(--text); font-weight:600; }
.na-step.ok  { color:var(--text-2); }
.na-step-ic { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; border:1.5px solid var(--border); color:var(--text-3); background:var(--surface); }
.na-step.run .na-step-ic { border-color:var(--primary); color:var(--primary); }
.na-step.ok .na-step-ic { border-color:#15803D; background:#15803D; color:#fff; }
.na-step-how { font-size:11px; color:var(--text-3); font-style:italic; margin-left:auto; text-align:right; max-width:300px; }
.na-exec-progress { height:6px; background:rgba(0,0,0,0.07); border-radius:4px; overflow:hidden; margin:4px 0 18px; }
.na-exec-progress-bar { height:100%; background:var(--primary); border-radius:4px; transition:width 0.4s ease; }

/* Categorisation (Section A) */
.na-cat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:14px; }
.na-cat-card { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
.na-cat-k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:6px; }
.na-cat-v { font-size:14px; font-weight:700; color:var(--text); line-height:1.4; }
.na-conf-track { height:8px; background:rgba(0,0,0,0.08); border-radius:4px; overflow:hidden; margin-top:8px; }
.na-conf-fill { height:100%; background:#15803D; border-radius:4px; }
/* Trigger box with a matched risk-register entry — green border + register tag */
.na-cat-card.reg-matched { border:1.5px solid #15803D; border-left:4px solid #15803D; box-shadow:0 0 0 1px rgba(21,128,61,0.25), var(--shadow); }
.na-reg-tag { margin-top:10px; display:flex; align-items:flex-start; gap:6px; font-size:11.5px; font-weight:700; color:#15803D; background:rgba(21,128,61,0.08); border:1px solid rgba(21,128,61,0.3); border-radius:6px; padding:5px 9px; line-height:1.45; }
.na-reg-tag i { margin-top:2px; flex-shrink:0; }
.na-chip { display:inline-block; font-size:11px; font-weight:600; padding:3px 10px; margin:2px 4px 2px 0; border-radius:20px; background:var(--primary-light); color:var(--primary-dark); }
.na-sentiment { display:inline-flex; align-items:center; gap:7px; font-weight:700; }

/* Human-in-the-loop */
.na-hitl { background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid #FFAD28; border-radius:var(--radius); padding:14px 18px; margin-bottom:16px; }
.na-hitl-title { font-size:13px; font-weight:800; color:#92400E; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.na-hitl-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
.na-hitl-note { font-size:12px; color:#15803D; font-weight:700; display:flex; align-items:center; gap:6px; margin-top:8px; }
.na-hitl-note.reject { color:#991B1B; }
.na-thumb { display:inline-flex; align-items:center; gap:8px; padding:9px 20px; font-size:13px; font-weight:700; border-radius:var(--radius); cursor:pointer; border:1.5px solid var(--border); background:var(--surface); font-family:inherit; transition:all 0.15s; }
.na-thumb.up { color:#15803D; border-color:#86EFAC; }
.na-thumb.up:hover { background:#F0FDF4; border-color:#15803D; }
.na-thumb.down { color:#991B1B; border-color:#FCA5A5; }
.na-thumb.down:hover { background:#FEF2F2; border-color:#991B1B; }
.na-hitl-comment { width:100%; min-height:72px; padding:10px 12px; font-size:13px; font-family:inherit; border:1.5px solid #FCA5A5; border-radius:var(--radius-sm); background:#fff; color:var(--text); outline:none; resize:vertical; box-sizing:border-box; }
.na-hitl-comment:focus { border-color:#991B1B; }

/* Transmission map (Section F) */
.na-map { display:flex; align-items:stretch; overflow-x:auto; padding:8px 2px 14px; }
.na-map-col { flex:1; min-width:150px; display:flex; flex-direction:column; }
.na-map-col-title { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); text-align:center; margin-bottom:10px; }
.na-map-nodes { display:flex; flex-direction:column; gap:8px; flex:1; justify-content:center; }
.na-map-node { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:12px; font-weight:600; color:var(--text); text-align:center; box-shadow:var(--shadow); border-left:4px solid var(--na-sev,var(--primary)); }
.na-map-node small { display:block; font-size:9.5px; font-weight:700; margin-top:2px; text-transform:uppercase; letter-spacing:0.4px; }
.na-map-arrow { display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:16px; padding:0 4px; flex-shrink:0; }

/* Financial impact (Section G) */
.na-fin-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.na-fin-kpi { background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--primary); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow); }
.na-fin-kpi-ic { font-size:15px; margin-bottom:8px; }
.na-fin-kpi-val { font-size:21px; font-weight:800; line-height:1.05; }
.na-fin-kpi-lbl { font-size:11px; font-weight:600; color:var(--text-3); margin-top:4px; }
.na-fin-kpi-delta { font-size:11px; font-weight:700; margin-top:6px; }
/* Financial Impact Dashboard — cards from Excel figures */
.na-fin-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-bottom:16px; }
.na-fin-card { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow); }
.na-fin-head { display:flex; align-items:center; gap:9px; margin-bottom:9px; flex-wrap:wrap; }
.na-fin-ic { width:28px; height:28px; border-radius:7px; background:var(--primary-light); color:var(--primary); display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.na-fin-title { font-size:13.5px; font-weight:800; color:var(--text); line-height:1.25; }
.na-fin-chip { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-3); background:rgba(0,0,0,0.05); border:1px solid var(--border); border-radius:20px; padding:2px 8px; }
.na-fin-viz { margin-top:4px; }
.na-fin-viz svg { max-height:136px; display:block; }
.na-fin-legend { display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.na-fin-leg-item { display:inline-flex; align-items:center; gap:5px; font-size:11px; }
.na-fin-leg-k { color:var(--text-3); font-weight:600; }
.na-fin-leg-v { color:var(--primary); font-weight:800; }
.na-fin-leg-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; display:inline-block; }
.na-fin-purpose { font-size:11.5px; color:var(--text-2); line-height:1.5; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.na-fin-pctls { display:flex; gap:10px; margin-bottom:12px; }
.na-fin-pctl { flex:1; }
.na-fin-pctl-v { font-size:18px; font-weight:800; color:var(--text); line-height:1.05; letter-spacing:-0.3px; }
.na-fin-pctl-k { font-size:9px; font-weight:600; color:var(--text-3); margin-top:3px; }
.na-fin-clickable { cursor:pointer; transition:box-shadow 0.15s, border-color 0.15s; }
.na-fin-clickable:hover { box-shadow:0 6px 18px rgba(0,0,0,0.12); border-color:var(--primary); }
.na-fin-expand { margin-left:auto; color:var(--text-3); font-size:11px; opacity:0; transition:opacity 0.15s; }
.na-fin-clickable:hover .na-fin-expand { opacity:1; }
.na-fin-modal { position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:1000; display:flex; align-items:center; justify-content:center; padding:30px; }
.na-fin-modal-box { background:var(--surface); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,0.35); width:min(780px,94vw); max-height:92vh; overflow-y:auto; padding:24px 28px; }
.na-fin-modal-head { display:flex; align-items:center; gap:11px; margin-bottom:18px; }
.na-fin-modal-title { font-size:18px; font-weight:800; color:var(--text); }
.na-fin-modal-close { margin-left:auto; background:none; border:none; font-size:19px; color:var(--text-3); cursor:pointer; line-height:1; }
.na-fin-modal-close:hover { color:var(--text); }
.na-fin-modal-cap { font-size:12.5px; color:var(--text-2); line-height:1.6; margin-top:12px; font-style:italic; }
/* stat tiles (mixed-unit label→value) */
.na-fin-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px; }
.na-fin-stat { background:var(--primary-light); border:1px solid var(--border); border-radius:8px; padding:9px 10px; }
.na-fin-stat-val { font-size:18px; font-weight:800; color:var(--primary); line-height:1.1; }
.na-fin-stat-lbl { font-size:10px; font-weight:600; color:var(--text-3); margin-top:3px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
/* mini horizontal bar chart (same-unit comparison) */
.na-fin-bars { display:flex; flex-direction:column; gap:8px; }
.na-fin-bar-row { display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:9px; }
.na-fin-bar-lbl { font-size:11px; font-weight:600; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.na-fin-bar-track { height:12px; background:rgba(0,0,0,0.06); border-radius:6px; overflow:hidden; }
.na-fin-bar-fill { display:block; height:100%; background:var(--primary); border-radius:6px; }
.na-fin-bar-val { font-size:12px; font-weight:800; color:var(--primary); white-space:nowrap; }
/* figure chips (no clean pairs) */
.na-fin-chips { display:flex; flex-wrap:wrap; gap:7px; }
.na-fin-chip-num { font-size:15px; font-weight:800; color:var(--primary); background:var(--primary-light); border:1px solid var(--border); border-radius:8px; padding:5px 11px; white-space:nowrap; }
.na-fin-summary { display:flex; flex-direction:column; gap:10px; }
.na-fin-sumtext { font-size:12px; color:var(--text-2); line-height:1.55; }
.na-bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.na-bar-lbl { font-size:12px; font-weight:600; color:var(--text-2); width:180px; flex-shrink:0; }
.na-bar-track { flex:1; height:20px; background:rgba(0,0,0,0.06); border-radius:5px; overflow:hidden; }
.na-bar-fill { height:100%; border-radius:5px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:11px; font-weight:800; color:#fff; transition:width 0.6s ease; }

/* Escalation matrix (Section H) */
.na-esc-wrap { overflow-x:auto; }
.na-esc { border-collapse:separate; border-spacing:4px; width:100%; min-width:560px; }
.na-esc th { font-size:11px; font-weight:700; color:var(--text-3); padding:6px 8px; text-align:center; }
.na-esc th.na-esc-rh { text-align:left; min-width:150px; }
.na-esc td { text-align:center; padding:9px 6px; border-radius:5px; font-size:11px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:0.3px; }
.na-esc td.na-esc-rh { color:var(--text); font-weight:700; text-align:left; background:#F1F5F9; text-transform:none; letter-spacing:0; font-size:12.5px; }

/* Playbook rows */
.na-pb-exposure { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; background:#FFF7ED; border:1px solid #FDBA74; border-radius:var(--radius-sm); padding:10px 14px; margin:2px 0 12px; }
.na-pb-exposure-k { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:#C2410C; }
.na-pb-exposure-v { font-size:12.5px; font-weight:700; color:var(--text); line-height:1.5; }
.na-pb-row { display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); }
.na-pb-row:last-child { border-bottom:none; }
.na-pb-action { font-size:13.5px; font-weight:700; color:var(--text); line-height:1.4; }
.na-pb-strap { font-size:12.5px; color:var(--text-2); margin-top:3px; line-height:1.5; }
.na-act-row { border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; overflow:hidden; background:var(--surface); }
.na-act-head { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
.na-act-head:hover { background:rgba(0,0,0,0.02); }
.na-act-num { width:24px; height:24px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.na-act-title { flex:1; font-size:13.5px; font-weight:600; color:var(--text); }
.na-act-body { padding:0 16px 14px 52px; font-size:12.5px; color:var(--text-2); line-height:1.6; }
.na-act-meta { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; }
.na-act-meta span { color:var(--text-3); }
.na-act-meta strong { color:var(--text-2); }

/* Chatbot (Agent 4) */
.na-chat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.na-chat-head { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); font-size:13px; font-weight:800; color:var(--text); }
.na-chat-body { padding:16px 18px; max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.na-chat-msg { display:flex; gap:10px; max-width:88%; }
.na-chat-msg.user { align-self:flex-end; flex-direction:row-reverse; }
.na-chat-av { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.na-chat-av.bot { background:var(--primary); color:#fff; }
.na-chat-av.user { background:#334155; color:#fff; }
.na-chat-bubble { padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.6; }
.na-chat-msg.bot .na-chat-bubble { background:#F1F5F9; color:var(--text); border-top-left-radius:3px; }
.na-chat-msg.user .na-chat-bubble { background:var(--primary-light); color:var(--text); border-top-right-radius:3px; }
.na-chat-typing { display:inline-flex; gap:4px; align-items:center; padding:2px 0; }
.na-chat-typing span { width:6px; height:6px; border-radius:50%; background:var(--text-3); display:inline-block; animation:naType 1.2s infinite ease-in-out; }
.na-chat-typing span:nth-child(2) { animation-delay:0.2s; }
.na-chat-typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes naType { 0%,60%,100%{ transform:translateY(0); opacity:0.4; } 30%{ transform:translateY(-4px); opacity:1; } }
.na-chat-suggest { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 14px; }
.na-chat-sg { font-size:12px; font-weight:600; padding:6px 12px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text-2); cursor:pointer; transition:all 0.15s; }
.na-chat-sg:hover { border-color:var(--primary); background:var(--primary-light); color:var(--text); }
.na-chat-input { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); }
.na-chat-input input { flex:1; padding:10px 14px; font-size:13px; border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); outline:none; }
.na-chat-input input:focus { border-color:var(--primary); }

/* Floating chatbot */
.na-fab { position:fixed; right:26px; bottom:26px; width:60px; height:60px; border-radius:50%; background:var(--primary); color:#fff; border:none; box-shadow:0 8px 24px rgba(0,0,0,0.28); font-size:23px; cursor:pointer; z-index:1200; display:flex; align-items:center; justify-content:center; transition:transform 0.18s, background 0.18s; }
.na-fab:hover { background:var(--primary-hover); transform:scale(1.07); }
.na-fab-badge { position:absolute; top:-2px; right:-2px; background:#991B1B; color:#fff; font-size:10px; font-weight:800; border-radius:20px; padding:2px 7px; border:2px solid var(--surface); }
.na-fab-pulse { position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 0 rgba(255,173,40,0.55); animation:naPulse 2s infinite; }
@keyframes naPulse { 0%{ box-shadow:0 0 0 0 rgba(255,173,40,0.5); } 70%{ box-shadow:0 0 0 16px rgba(255,173,40,0); } 100%{ box-shadow:0 0 0 0 rgba(255,173,40,0); } }
.na-chatwin { position:fixed; right:26px; bottom:98px; width:392px; max-width:calc(100vw - 44px); max-height:72vh; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 16px 44px rgba(0,0,0,0.30); z-index:1200; display:flex; flex-direction:column; overflow:hidden; }
.na-chatwin .na-chat-head { border-bottom:1px solid var(--border); background:linear-gradient(135deg,rgba(255,173,40,0.10),transparent); }
.na-chatwin .na-chat-body { flex:1; min-height:150px; }
.na-chatwin-close { margin-left:auto; background:none; border:none; color:var(--text-3); font-size:16px; cursor:pointer; padding:2px 4px; }
.na-chatwin-close:hover { color:var(--text); }

/* Agent tabs + processing panel */
.na-tabs { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 20px; }
.na-tab { flex:1; min-width:200px; display:flex; align-items:center; gap:11px; padding:12px 16px; border:1.5px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); cursor:pointer; transition:all 0.15s; text-align:left; font-family:inherit; }
.na-tab.locked { cursor:not-allowed; opacity:0.5; }
.na-tab:not(.locked):hover { border-color:var(--primary); }
.na-tab.active { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.na-tab-ic { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; background:#F1F5F9; color:var(--text-3); }
.na-tab.active .na-tab-ic { background:var(--primary); color:#fff; }
.na-tab.status-processing .na-tab-ic { background:var(--primary); color:#fff; }
.na-tab.status-done .na-tab-ic { background:#15803D; color:#fff; }
.na-tab-lbl { font-size:13px; font-weight:800; color:var(--text); line-height:1.2; display:block; }
.na-tab-sub { font-size:10.5px; color:var(--text-3); margin-top:2px; display:block; }
.na-proc { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 24px; max-width:560px; margin:0 auto 26px; text-align:center; }
.na-proc-title { font-size:16px; font-weight:800; color:var(--text); display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:4px; }
.na-proc-role { font-size:12.5px; color:var(--text-3); margin-bottom:18px; }
.na-proc-steps { max-width:340px; margin:0 auto; text-align:left; }
.na-outbtn-wrap { margin-top:18px; padding-top:16px; border-top:1px dashed var(--border); display:flex; justify-content:center; }
.na-continue-wrap { display:flex; justify-content:center; gap:12px; margin:6px 0 34px; }

/* Assess split — narrow steps panel on the left, report on the right */
/* Sticky report header — keeps the event title + agent nav visible while scrolling */
.na-sticky-head { position:sticky; top:0; z-index:250; background:#F1F5F9; margin:0 -36px; padding:16px 36px 8px; box-shadow:0 10px 12px -10px rgba(0,0,0,0.18); }
.na-sticky-head .page-header { margin-bottom:10px !important; }
.na-sticky-head .na-proc-nav { margin:8px auto 4px; }
.na-assess-split { display:flex; gap:22px; align-items:flex-start; }
.na-assess-left { flex:0 0 250px; position:sticky; top:200px; }
.na-assess-right { flex:1; min-width:0; }
.na-proc.na-proc-side { max-width:none; margin:0; text-align:left; padding:18px 18px; }
.na-proc.na-proc-side .na-proc-role { padding-left:0; }
@media (max-width:1000px){ .na-assess-split { flex-direction:column; } .na-assess-left { position:static; flex-basis:auto; width:100%; } }

/* Print / PDF export — hide chrome, show the full report */
@media print {
  .topnav, .sidebar, .na-proc-nav, .na-proc, .na-continue-wrap, .na-fab, .na-chatwin, .na-no-print { display:none !important; }
  body, .app, .main, .page { background:#fff !important; height:auto !important; overflow:visible !important; }
  .scenario-section-header { break-after:avoid; }
  .card, .ni-panel, .na-panel, .scenario-meta-card, .scope-card, .reg-card, .quant-card { box-shadow:none !important; break-inside:avoid; }
  .impact-table-wrap, .na-esc-wrap, .na-heat-wrap { overflow:visible !important; }
}

/* Agent process stepper (connected nodes, centered) */
.na-proc-nav { display:flex; align-items:flex-start; justify-content:center; margin:22px auto 26px; max-width:1060px; }
.na-proc-group { position:relative; border:1.5px dashed rgba(15,23,42,0.2); border-radius:14px; padding:8px 8px 4px; margin-top:-7px; display:flex; flex-direction:column; align-items:center; }
.na-proc-group-lbl { position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:#F1F5F9; padding:0 10px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--primary); white-space:nowrap; }
.na-proc-group-row { display:flex; align-items:flex-start; }
.na-proc-node { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; width:158px; flex:0 0 auto; text-align:center; }
.na-proc-node.locked { cursor:not-allowed; opacity:0.5; }
.na-proc-circle { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; background:#F1F5F9; color:var(--text-3); border:2px solid var(--border); transition:all 0.2s; }
.na-proc-node.active .na-proc-circle { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-light); }
.na-proc-node.status-processing .na-proc-circle { background:var(--primary); color:#fff; border-color:var(--primary); }
.na-proc-node.status-done .na-proc-circle { background:#15803D; color:#fff; border-color:#15803D; }
.na-proc-node-lbl { font-size:12.5px; font-weight:800; color:var(--text); line-height:1.25; }
.na-proc-node.locked .na-proc-node-lbl { color:var(--text-3); }
.na-proc-node-sub { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); }
.na-proc-connector { flex:1; min-width:24px; height:3px; background:var(--border); margin-top:22px; border-radius:2px; transition:background 0.3s; }
.na-proc-connector.done { background:#15803D; }

.briefing-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
.briefing-modal { background:var(--surface); border-radius:var(--radius); padding:32px 36px; max-width:700px; width:100%; box-shadow:var(--shadow-lg); position:relative; }
.briefing-modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.briefing-modal-title { font-size:17px; font-weight:700; color:var(--text); }
.briefing-modal-close { background:none; border:none; cursor:pointer; color:var(--text-3); font-size:18px; padding:4px; }
.briefing-modal-close:hover { color:var(--text); }
.briefing-content { font-size:13.5px; color:var(--text); line-height:1.8; white-space:pre-wrap; }
.briefing-actions { display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); flex-wrap:wrap; }

.scenario-section-header { font-size:16px; font-weight:700; color:var(--text); margin:24px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:10px; }
.section-letter { width:28px; height:28px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0; }

.heatmap-wrap { overflow-x:auto; }
.heatmap-table { width:100%; border-collapse:collapse; font-size:12px; }
.heatmap-table th { background:#1E293B; color:#fff; padding:8px 10px; text-align:center; font-weight:600; font-size:11px; white-space:nowrap; }
.heatmap-table th:first-child { text-align:left; min-width:180px; }
.heatmap-table td { padding:7px 10px; border:1px solid var(--border); text-align:center; font-weight:600; font-size:11px; }
.heatmap-table td:first-child { text-align:left; font-weight:500; }
.hm-critical { background:#991B1B; color:#fff; }
.hm-high     { background:#EA580C; color:#fff; }
.hm-elevated { background:#FFAD28; color:#fff; }
.hm-normal   { background:#E2E8F0; color:#475569; }

.scenario-charts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:20px; margin-bottom:16px; }
.scenario-chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.scenario-chart-title { font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:0.4px; flex:1; margin-bottom:0; }
.scenario-chart-unavail { font-size:13px; color:var(--text-3); font-style:italic; padding:20px 0; text-align:center; }

/* ── Chart card header & icon buttons ─────────────────────────────── */
.scenario-chart-card-hdr { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.chart-icon-btn { border:none; background:none; cursor:pointer; padding:3px 6px; border-radius:4px; color:var(--text-3); font-size:13px; line-height:1; transition:all 0.15s; flex-shrink:0; }
.chart-icon-btn:hover { background:var(--primary-light); color:var(--primary); }
.chart-info-wrap { position:relative; display:inline-flex; }
.chart-info-tip {
  position:absolute; bottom:calc(100% + 7px); right:0;
  width:230px; background:#1E293B; color:#F8FAFC;
  font-size:11.5px; font-weight:400; line-height:1.5;
  padding:9px 12px; border-radius:7px; z-index:300;
  pointer-events:none; opacity:0; transition:opacity 0.15s;
  text-transform:none; letter-spacing:0; white-space:normal;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
}
.chart-info-tip::after { content:''; position:absolute; top:100%; right:10px; border:5px solid transparent; border-top-color:#1E293B; }
.chart-info-wrap:hover .chart-info-tip { opacity:1; }

/* ── Chart expand/fullscreen modal ────────────────────────────────── */
.chart-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.65);
  z-index:1200; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.chart-modal {
  background:var(--surface); border-radius:14px;
  width:100%; max-width:980px; max-height:90vh;
  display:flex; flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,0.35); overflow:hidden;
}
.chart-modal-hdr {
  display:flex; align-items:flex-start; padding:16px 20px 14px;
  border-bottom:1px solid var(--border); gap:12px; flex-shrink:0;
}
.chart-modal-hdr-text { flex:1; }
.chart-modal-title { font-size:15px; font-weight:600; color:var(--text); }
.chart-modal-desc { font-size:12px; color:var(--text-3); margin-top:3px; line-height:1.45; }
.chart-modal-controls { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.chart-zoom-btn {
  border:1px solid var(--border); background:var(--surface);
  cursor:pointer; padding:5px 10px; border-radius:5px;
  color:var(--text-2); font-size:12px; font-weight:600;
  transition:all 0.15s; font-family:inherit;
}
.chart-zoom-btn:hover { background:var(--primary-light); color:var(--primary); border-color:var(--primary); }
.chart-modal-body { flex:1; padding:18px 22px 20px; min-height:0; overflow:hidden; }

/* Enhanced Risk Transmission Flow */
.risk-flow-step {
  position:relative;
  cursor:pointer;
  transition:all 0.15s;
  user-select:none;
}
.risk-flow-step:hover { box-shadow:var(--shadow-md); }
.risk-flow-step.active-step { border-color:var(--primary) !important; box-shadow:0 0 0 3px var(--primary-light),var(--shadow-md) !important; }
.risk-flow-step.trigger.active-step { box-shadow:0 0 0 3px rgba(255,255,255,0.3),var(--shadow-md) !important; }
.flow-info-icon {
  position:absolute; top:8px; right:10px;
  font-size:12px; opacity:0.55; transition:opacity 0.15s;
  line-height:1;
}
.risk-flow-step:hover .flow-info-icon,
.risk-flow-step.active-step .flow-info-icon { opacity:1; }
.risk-flow-step.trigger .flow-info-icon,
.risk-flow-step.escalation .flow-info-icon { color:rgba(255,255,255,0.85); }

.flow-popover {
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--primary);
  border-radius:var(--radius);
  padding:16px 18px;
  margin:4px 0 0;
  box-shadow:var(--shadow-lg);
  width:100%;
  min-width:300px;
  max-width:540px;
  animation:popoverIn 0.15s ease;
  position:relative;
  z-index:10;
}
@keyframes popoverIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.flow-popover-title { font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:4px; padding-right:20px; }
.flow-popover-close { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; color:var(--text-3); font-size:14px; padding:2px 4px; }
.flow-popover-close:hover { color:var(--text); }
.flow-popover-explanation { font-size:13px; color:var(--text-2); line-height:1.55; margin-bottom:12px; }
.flow-popover-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.flow-popover-tag { display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; }
.flow-popover-tag-label { color:var(--text-3); text-transform:uppercase; letter-spacing:0.4px; }
.flow-popover-tag-val { color:var(--text-2); }
.flow-evidence-block {
  background:#F8FAFC; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; font-size:12.5px; color:var(--text-2); line-height:1.6;
  font-style:italic; margin-bottom:10px;
  border-left:2px solid var(--primary);
}
.flow-evidence-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--primary); margin-bottom:4px; font-style:normal; }
.flow-popover-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.flow-source-ref { font-size:11px; color:var(--text-3); display:flex; align-items:center; gap:4px; }
.flow-view-source-btn { font-size:11.5px; font-weight:600; color:var(--primary); background:var(--primary-light); border:none; border-radius:20px; padding:4px 12px; cursor:pointer; font-family:inherit; transition:all 0.15s; display:flex; align-items:center; gap:5px; }
.flow-view-source-btn:hover { background:#f0dcdc; }

/* Source Drawer */
.source-drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:2000; }
.source-drawer {
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw;
  background:var(--surface); box-shadow:-4px 0 24px rgba(0,0,0,0.12);
  display:flex; flex-direction:column; z-index:2001;
  animation:drawerIn 0.22s ease;
}
@keyframes drawerIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
.source-drawer-header {
  padding:20px 24px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
}
.source-drawer-title { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; }
.source-drawer-close { background:none; border:none; cursor:pointer; color:var(--text-3); font-size:18px; padding:2px; flex-shrink:0; }
.source-drawer-close:hover { color:var(--text); }
.source-drawer-body { flex:1; overflow-y:auto; padding:20px 24px; }
.source-drawer-section { margin-bottom:20px; }
.source-drawer-section-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:6px; }
.source-drawer-section-val { font-size:13.5px; color:var(--text); line-height:1.65; }
.source-drawer-evidence { background:#F8FAFC; border:1px solid var(--border); border-left:3px solid var(--primary); border-radius:var(--radius-sm); padding:14px 16px; font-size:13px; color:var(--text-2); line-height:1.7; font-style:italic; margin-top:6px; }
.source-drawer-footer { padding:16px 24px; border-top:1px solid var(--border); font-size:11px; color:var(--text-3); }

.btn-outline { padding:9px 18px; background:var(--surface); color:var(--text); border:1.5px solid var(--border); border-radius:var(--radius); font-size:13.5px; font-weight:600; cursor:pointer; transition:all 0.15s; font-family:inherit; display:inline-flex; align-items:center; gap:7px; }

/* Enhanced Action Playbook */
.action-row-enhanced {
  border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px;

.action-row-enhanced:hover { border-color:#CBD5E1; box-shadow:var(--shadow); }
.action-row-enhanced.expanded { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light); }
.action-row-header { display:flex; align-items:flex-start; gap:12px; padding:13px 16px; }
.action-row-main { flex:1; min-width:0; }
.action-row-title { font-size:13.5px; font-weight:600; color:var(--text); line-height:1.35; margin-bottom:3px; }
.action-row-short { font-size:12.5px; color:var(--text-2); line-height:1.4; }
.action-row-right { display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
.action-row-chevron { font-size:11px; color:var(--text-3); transition:transform 0.2s; }
.action-row-enhanced.expanded .action-row-chevron { transform:rotate(180deg); }
.action-row-owner { font-size:11px; color:var(--text-3); max-width:160px; text-align:right; line-height:1.3; display:none; }
@media(min-width:640px){ .action-row-owner { display:block; } }

.action-row-detail {
  border-top:1px solid var(--border); padding:16px 18px;

}

.action-detail-section { margin-bottom:12px; }
.action-detail-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-bottom:4px; }
.action-detail-text { font-size:13px; color:var(--text); line-height:1.7; }
.action-why-block { background:#FFFBEB; border:1px solid #FDE68A; border-left:3px solid #FFAD28; border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; color:#78350F; line-height:1.65; margin-bottom:12px; }
.action-why-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#FFAD28; margin-bottom:4px; }
.action-detail-meta { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--text-2); }
.action-meta-pair { display:flex; align-items:center; gap:4px; }
.action-meta-key { color:var(--text-3); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; }

.playbook-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }

.playbook-toolbar-btns { display:flex; gap:8px; }

.action-summary-panel {

}
.action-summary-header { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#FFAD28; margin-bottom:8px; display:flex; align-items:center; gap:6px; }

/* Crisis Snapshot */
.crisis-snapshot-card {

}

.crisis-bullets { list-style:none; padding:0; margin:0; }

/* Actions dropdown */
.actions-dropdown-wrap { position:relative; }
.actions-dropdown-btn {
  display:flex; align-items:center; gap:6px; padding:7px 14px;
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius);

}

.actions-dropdown-menu {

}

  display:flex; align-items:center; gap:10px; padding:10px 16px;

.quant-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; margin-top:4px; }
.quant-card {

.quant-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px; }
.quant-label { font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:0.6px; }
.quant-info-icon { font-size:12px; color:var(--text-3); opacity:0.6; transition:opacity 0.15s; flex-shrink:0; margin-top:1px; }
.quant-card:hover .quant-info-icon, .quant-card.qc-open .quant-info-icon { opacity:1; color:var(--primary); }

.quant-popover {

}

.quant-popover-evidence { background:#fff; border:1px solid var(--border); border-left:2px solid var(--primary); border-radius:var(--radius-sm); padding:8px 10px; font-size:12px; color:var(--text-2); line-height:1.6; font-style:italic; margin-top:4px; }

<div id="root"></div>
<div id="__boot_error__" style="display:none;position:fixed;inset:0;background:#1a0000;color:#ff8080;font-family:monospace;font-size:13px;padding:24px;overflow:auto;z-index:99999;white-space:pre-wrap;"></div>
<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('__boot_error__');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'ERROR: ' + e.message + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + '\n' + (e.error && e.error.stack ? e.error.stack : '') + '\n\n';
  });
  window.addEventListener('unhandledrejection', function(e) {
    var el = document.getElementById('__boot_error__');
    if (!el) return;

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Chart Config ─────────────────────────────────────────────────────────────
const CHART_PALETTE = [

  '#1E3A5F','#1E40AF','#2563EB','#3B82F6',
  '#7C3AED','#059669'
];

function buildChartConfig(type, data, title, highlightIndex, highlightType) {
  const fmt = v => typeof v === 'number' && v > 1000 ? `£${v.toLocaleString()}` : String(v);

  const baseOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, padding: 16, color: '#1E293B' } },
      title: {
        display: true, text: title,
        font: { family: 'Inter', size: 15, weight: '600' },
        color: '#1E293B', padding: { bottom: 16 }
      }
    }
  };

  if (type === 'bar') {
    const maxIdx  = data.values.indexOf(Math.max(...data.values));
    const hlIdx   = highlightIndex != null ? highlightIndex : maxIdx;
    const isMin   = highlightType === 'min';
    const bgColors  = data.values.map((_, i) => i === hlIdx ? '#FFAD28' : 'rgba(148,163,184,0.35)');
    const hvrColors = data.values.map((_, i) => i === hlIdx ? '#B91C1C' : 'rgba(148,163,184,0.55)');
    return {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [{
          label: 'Count',
          data: data.values,
          backgroundColor: bgColors,
          hoverBackgroundColor: hvrColors,
          borderRadius: 4,
          borderSkipped: false
        }]
      },
      options: {
        ...baseOpts,
        plugins: {
          ...baseOpts.plugins,
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const val = ctx.parsed.y;
                const suffix = ctx.dataIndex === hlIdx ? (isMin ? '  ★ Smallest' : '  ★ Largest') : '';
                return ` ${val.toLocaleString()}${suffix}`;
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 }, color: '#334155'} },
          y: { grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { font: { family: 'Inter', size: 12 }, color: '#334155'}, beginAtZero: true }
        }
      }
    };
  }

  if (type === 'doughnut') {
    const hlIdx = highlightIndex != null ? highlightIndex : data.values.indexOf(Math.max(...data.values));
    const isMin = highlightType === 'min';
    const bgColors = CHART_PALETTE.map((c, i) => i === hlIdx ? '#FFAD28' : c);
    return {
      type: 'doughnut',
      data: {
        labels: data.labels,
        datasets: [{
          data: data.values,
          backgroundColor: bgColors,
          hoverOffset: 8,
          borderWidth: 2,
          borderColor: '#fff'
        }]
      },
      options: {
        ...baseOpts,
        plugins: {
          ...baseOpts.plugins,
          legend: { position: 'right', labels: { font: { family: 'Inter', size: 12 }, padding: 14, color: '#1E293B' } },
          tooltip: {
            callbacks: {
              label: ctx => {
                const val = ctx.parsed;
                const suffix = ctx.dataIndex === hlIdx ? (isMin ? '  ★ Smallest' : '  ★ Highlighted') : '';
                return ` ${val.toLocaleString()}${suffix}`;
              }
            }
          }
        },
        cutout: '62%'
      }
    };
  }

  if (type === 'horizontalBar') {
    const maxIdx  = data.values.indexOf(Math.max(...data.values));
    const hlIdx   = highlightIndex != null ? highlightIndex : maxIdx;
    const isMin   = highlightType === 'min';
    const bgColors  = data.values.map((_, i) => i === hlIdx ? '#FFAD28' : 'rgba(148,163,184,0.35)');
    const hvrColors = data.values.map((_, i) => i === hlIdx ? '#B91C1C' : 'rgba(148,163,184,0.55)');
    const isGBP = data.values.some(v => v > 10000);
    return {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [{
          label: 'Value',
          data: data.values,
          backgroundColor: bgColors,
          hoverBackgroundColor: hvrColors,
          borderRadius: 4,
          borderSkipped: false
        }]
      },
      options: {
        ...baseOpts,
        indexAxis: 'y',
        plugins: {
          ...baseOpts.plugins,
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const val = ctx.raw;
                const suffix = ctx.dataIndex === hlIdx ? (isMin ? '  ★ Lowest' : '  ★ Highest') : '';
                return isGBP ? `  £${val.toLocaleString()}${suffix}` : `  ${val.toLocaleString()}${suffix}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(0,0,0,0.08)' },
            ticks: { font: { family: 'Inter', size: 12 }, color: '#94A3B8', callback: v => isGBP ? `£${Number(v).toLocaleString()}` : Number(v).toLocaleString() },
            beginAtZero: true
          },
          y: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 }, color: '#334155'} }
        }
      }
    };
  }

  if (type === 'line') {
    return {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [{
          label: 'Transaction Volume',
          data: data.values,
          borderColor: '#FFAD28',
          backgroundColor: 'rgba(255,173,40,0.08)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#FFAD28',
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        ...baseOpts,
        plugins: {
          ...baseOpts.plugins,
          tooltip: { callbacks: { label: ctx => `  £${ctx.raw.toLocaleString()}` } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 12 }, color: '#334155'} },
          y: {
            grid: { color: 'rgba(0,0,0,0.08)' },
            ticks: { font: { family: 'Inter', size: 12 }, color: '#94A3B8', callback: v => `£${Number(v).toLocaleString()}` },
            beginAtZero: true
          }
        }
      }
    };
  }

  return null;
}

// ── Components ───────────────────────────────────────────────────────────────

function ChartComponent({ type, data, title, highlightIndex, highlightType }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }

    const cfg = buildChartConfig(type, data, title, highlightIndex, highlightType);
    if (!cfg) return;
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), cfg);
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [type, title, JSON.stringify(data), highlightIndex, highlightType]);

  return (
    <div className="chart-container">
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

function minDelay(minMs, maxMs) {
  const ms = minMs + Math.random() * (maxMs - minMs);
  return new Promise(resolve => setTimeout(resolve, ms));
}

function ProcessingView({ title, messages, icon }) {
  const [msgIdx,   setMsgIdx]   = useState(0);
  const [fade,     setFade]     = useState(true);

  useEffect(() => {
  }, []);

  useEffect(() => {
    const cycle = () => {
      const delay = 3200 + Math.random() * 1600;
      return setTimeout(() => {
        setFade(false);
        setTimeout(() => {
          setMsgIdx(i => (i + 1) % messages.length);
          setFade(true);
          cycleRef.current = cycle();
        }, 400);
      }, delay);
    };
    const cycleRef = { current: cycle() };
    return () => clearTimeout(cycleRef.current);
  }, []);

  return (
    <div className="processing-view">
      <div className="processing-icon-ring">
        <i className={`fa-solid ${icon || 'fa-microchip-ai'}`}></i>
      </div>
      <div className="processing-title">{title || 'Processing…'}</div>
      <div className="processing-msg" style={{opacity: fade ? 1 : 0}}>{messages[msgIdx]}</div>
      <div className="processing-bar-wrap"><div className="processing-bar"></div></div>
    </div>
  );
}
