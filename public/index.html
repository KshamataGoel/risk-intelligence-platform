  // ── ASSESS phase (tabbed, agent-by-agent) ─────────────────────────────────
  const ev = NA_FEED.find(e => e.id === runId);
  const d  = NA_DATA[ev.dataId];
  const c  = d.categorisation;
  const a3 = (typeof NA_A3 !== 'undefined' && NA_A3[ev.dataId]) || {};
  // Agent-1 categorisation fields — prefer the Excel-driven values, fall back to mock
  const catTrigger   = a3.trigger || c.trigger;
  const catPrimary   = a3.primaryEventType || c.primaryEventType;
  const catSecondary = a3.secondaryEventType || c.secondaryEventType;
  const catVelocity  = a3.velocity || c.velocity;
  const catSynopsis  = a3.synopsis || c.synopsis || ev.synopsis;
  const catBullets   = (a3.summaryBullets && a3.summaryBullets.length) ? a3.summaryBullets : c.summaryBullets;
  const foRows = a3.firstOrder || [];
  const soRows = a3.secondOrder || [];
  const foAll = [...foRows, ...customFO];
  const soAll = [...soRows, ...customSO];
  const isOn = (k) => !metricOff[k];
  const toggleMetric = (k) => setMetricOff(prev => ({ ...prev, [k]: !prev[k] }));

  const addStripe = () => {
    if (!addForm || !addForm.stripe.trim()) return;
    const mets = addForm.metric.split(';').map(s => s.trim()).filter(Boolean);
    const items = (mets.length ? mets : ['']).map(m => ({ metric:m, impact:addForm.impact.trim() }));
    const grp = { stripe:addForm.stripe.trim(), sev:addForm.sev, items };
    if (addForm.section === 'fo') setCustomFO(p => [...p, grp]); else setCustomSO(p => [...p, grp]);
    setAddForm(null);
  };

  const impactTable = (sec, groups) => (
    <div className="impact-table-wrap">
      <table className="impact-table" style={{tableLayout:'fixed'}}>
        <colgroup><col style={{width:'4%'}} /><col style={{width:'20%'}} /><col style={{width:'24%'}} /><col style={{width:'43%'}} /><col style={{width:'9%'}} /></colgroup>
        <thead><tr><th></th><th>Risk Stripe/Area</th><th>Linked Metric</th><th>Impact</th><th>Severity</th></tr></thead>
        <tbody>
          {groups.map((g, gi) => {
            const sKey = `${sec}|${gi}`;
            const sOn = !stripeOff[sKey];
            const impacts = [];
            if (sOn) (g.items||[]).forEach((it, mi) => { if (isOn(`${sec}|${gi}|${mi}`) && it.impact && !impacts.includes(it.impact)) impacts.push(it.impact); });
            return (
              <tr key={gi} style={{opacity: sOn ? 1 : 0.5}}>
                <td style={{textAlign:'center'}}><input type="checkbox" className="na-stripe-chk" checked={sOn} onChange={() => setStripeOff(p => ({ ...p, [sKey]: !p[sKey] }))} /></td>
                <td><strong style={{textDecoration: sOn ? 'none' : 'line-through'}}>{g.stripe}</strong></td>
                <td>
                  {(g.items||[]).map((it, mi) => {
                    const k = `${sec}|${gi}|${mi}`;
                    return <label key={mi} className="na-metric-chk"><input type="checkbox" checked={sOn && isOn(k)} disabled={!sOn} onChange={() => toggleMetric(k)} /> <span>{it.metric}</span></label>;
                  })}
                </td>
                <td>
                  {impacts.length ? (() => {
                    const open = !!impactOpen[sKey];
                    const many = impacts.length > 1 || (impacts.join(' ').length > 120);
                    return (
                      <div className="na-imp-cell">
                        <div className={`na-imp-text${open ? ' open' : ''}`}>
                          {impacts.map((im, k2) => <div key={k2} style={{marginBottom:k2<impacts.length-1?7:0}}>{im}</div>)}
                        </div>
                        {many && (
                          <button type="button" className="na-imp-toggle" onClick={() => setImpactOpen(p => ({ ...p, [sKey]: !p[sKey] }))}>
                            {open ? <>Show less <i className="fa-solid fa-chevron-up"></i></> : <>Show more <i className="fa-solid fa-chevron-down"></i></>}
                          </button>
                        )}
                      </div>
                    );
                  })() : <span style={{color:'var(--text-3)'}}>—</span>}
                </td>
                <td><span className={`sev-badge sev-${(g.sev||'').toLowerCase()}`}>{g.sev}</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );

  const addStripeUI = (sec) => (
    addForm && addForm.section === sec ? (
      <div className="na-addstripe">
        <input placeholder="Risk Stripe" autoComplete="off" name="na-stripe" value={addForm.stripe} onChange={e => setAddForm(f => ({ ...f, stripe:e.target.value }))} />
        <input placeholder="Metric (separate multiple with ;)" autoComplete="off" name="na-metric" value={addForm.metric} onChange={e => setAddForm(f => ({ ...f, metric:e.target.value }))} />
        <select value={addForm.sev} onChange={e => setAddForm(f => ({ ...f, sev:e.target.value }))}>
          {['Critical','High','Medium','Low'].map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <textarea className="full" placeholder="Impact" autoComplete="off" name="na-impact" value={addForm.impact} onChange={e => setAddForm(f => ({ ...f, impact:e.target.value }))} />
        <div className="na-addstripe-btns">
          <button className="btn-primary" style={{fontSize:12,padding:'7px 16px'}} disabled={!addForm.stripe.trim()} onClick={addStripe}><i className="fa-solid fa-check"></i> Add</button>
          <button className="btn-outline" style={{fontSize:12,padding:'7px 16px'}} onClick={() => setAddForm(null)}>Cancel</button>
        </div>
      </div>
    ) : (
      <button className="btn-outline na-no-print" style={{fontSize:12.5,padding:'8px 16px',marginTop:12}} onClick={() => setAddForm({ section:sec, stripe:'', metric:'', impact:'', sev:'High' })}>
        <i className="fa-solid fa-plus"></i> Add risk stripe
      </button>
    )
  );
  const actList = d.actions[actionTab] || [];
  const st = agentStatus[activeAgent];
  const isLast = activeAgent === NA_AGENTS.length - 1;
  const ag = NA_AGENTS[activeAgent];

  // Process-stepper node + connector (grouped so sub-agents like 3a/3b can be boxed)
  const procNode = (i) => {
    const a = NA_AGENTS[i]; const s = agentStatus[i]; const locked = s === 'locked';
    return (
      <div key={'n' + i} className={`na-proc-node status-${s} ${activeAgent === i ? 'active' : ''} ${locked ? 'locked' : ''}`}
        onClick={() => { if (!locked) setActiveAgent(i); }}>
        <div className="na-proc-circle">
          {s === 'done' ? <i className="fa-solid fa-check"></i>
            : s === 'processing' ? <i className="fa-solid fa-circle-notch fa-spin"></i>
            : locked ? <i className="fa-solid fa-lock" style={{ fontSize: 13 }}></i>
            : a.n}
        </div>
        <div className="na-proc-node-lbl">{a.short}</div>
        <div className="na-proc-node-sub">Agent {a.n}</div>
      </div>
    );
  };
  const procConn = (leftIdx) => <div key={'c' + leftIdx} className={`na-proc-connector ${agentStatus[leftIdx] === 'done' ? 'done' : ''}`}></div>;
  // Group consecutive sub-agents whose n is like '3a','3b' under one labelled box.
  const procGroups = [];
  NA_AGENTS.forEach((a, i) => {
    const m = String(a.n).match(/^(\d+)[a-z]$/i);
    const base = m ? m[1] : null;
    const last = procGroups[procGroups.length - 1];
    if (base && last && last.base === base) last.items.push(i);
    else procGroups.push({ base, items: [i] });
  });
  const groupLabels = { '3': 'Impact Assessment & Prioritisation Agent' };

  return (
    <div className="page" style={{maxWidth:'none'}}>
      <div className="na-no-print" style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <button className="btn-outline" style={{padding:'7px 14px',fontSize:13}} onClick={backToSelect}>
          <i className="fa-solid fa-arrow-left"></i> News Feed
        </button>
        <button className="btn-outline" style={{padding:'7px 14px',fontSize:13}} onClick={() => runAssessment(runId)}>
          <i className="fa-solid fa-rotate-right"></i> Re-run
        </button>
      </div>

      <div className="na-sticky-head">
      <div className="page-header" style={{marginBottom:16}}>
        <div className="page-title">{ev.title}</div>
        <div className="page-sub" style={{maxWidth:'none',whiteSpace:'nowrap'}}>{ev.type} · Source: {ev.source} · News Intelligence and Impact Assessment</div>
      </div>

      {/* Agent process stepper — connected nodes; sub-agents (3a/3b) grouped in a box */}
      <div className="na-proc-nav">
        {procGroups.map((g, gi) => (
          <React.Fragment key={'g' + gi}>
            {gi > 0 && procConn(procGroups[gi - 1].items[procGroups[gi - 1].items.length - 1])}
            {g.items.length > 1 ? (
              <div className="na-proc-group">
                <div className="na-proc-group-lbl">{groupLabels[g.base] || `Agent ${g.base}`}</div>
                <div className="na-proc-group-row">
                  {g.items.map((idx, k) => (
                    <React.Fragment key={idx}>
                      {k > 0 && procConn(g.items[k - 1])}
                      {procNode(idx)}
                    </React.Fragment>
                  ))}
                </div>
              </div>
            ) : procNode(g.items[0])}
          </React.Fragment>
        ))}
      </div>
      </div>{/* /na-sticky-head */}

      {/* Processing panel — the agent's 4 steps run in sequence (full page) */}
      {st === 'processing' && (
        <div className="na-proc">
          <div className="na-proc-title">
            <span className="na-proc-circle" style={{width:38,height:38,fontSize:14,background:st==='ready'?'#15803D':'var(--primary)',color:'#fff',borderColor:st==='ready'?'#15803D':'var(--primary)'}}>{st==='ready' ? <i className="fa-solid fa-check"></i> : ag.n}</span>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:16,fontWeight:800,color:'var(--text)',lineHeight:1.2}}>{ag.short}</div>
              <div style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:0.6,color:'var(--text-3)'}}>Agent {ag.n}</div>
            </div>
          </div>
          <div className="na-proc-role">{ag.role}</div>
          <div className="na-proc-steps">
            {ag.steps.map((s2, si) => {
              const stepDone = st === 'ready' || stepIdx > si;
              const stepRun  = st === 'processing' && stepIdx === si;
              return (
                <div key={si} className={`na-step ${stepDone?'ok':stepRun?'run':''}`}>
                  <span className="na-step-ic">
                    {stepDone ? <i className="fa-solid fa-check"></i>
                      : stepRun ? <i className="fa-solid fa-circle-notch fa-spin"></i>
                      : <i className="fa-regular fa-circle" style={{fontSize:9}}></i>}
                  </span>
                  <span>{s2.t}</span>
                </div>
              );
            })}
          </div>
          <div className="na-outbtn-wrap">
            {st === 'processing'
              ? <div style={{fontSize:12.5,color:'var(--text-3)'}}><i className="fa-solid fa-circle-notch fa-spin" style={{marginRight:8,color:'var(--primary)'}}></i>Agent {ag.n} processing — please wait for all steps to complete.</div>
              : <button className="btn-primary" style={{fontSize:14,padding:'10px 22px'}} onClick={() => genOutput(activeAgent)}><i className="fa-solid fa-file-lines"></i> Generate Report</button>}
          </div>
        </div>
      )}

      {/* Agent output — steps shrink to a left panel, report on the right */}
      {st === 'done' && (
        <div className="na-assess-split">
          <div className="na-assess-left na-no-print">
            <div className="na-proc na-proc-side">
              <div className="na-proc-title" style={{justifyContent:'flex-start'}}>
                <span className="na-proc-circle" style={{width:34,height:34,fontSize:13,background:'#15803D',color:'#fff',borderColor:'#15803D'}}><i className="fa-solid fa-check"></i></span>
                <div style={{textAlign:'left'}}>
                  <div style={{fontSize:15,fontWeight:800,color:'var(--text)',lineHeight:1.2}}>{ag.short}</div>
                  <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:0.6,color:'var(--text-3)'}}>Agent {ag.n}</div>
                </div>
              </div>
              <div className="na-proc-role" style={{textAlign:'left'}}>{ag.role}</div>
              <div className="na-proc-steps" style={{maxWidth:'none'}}>
                {ag.steps.map((s2, si) => (
                  <div key={si} className="na-step ok"><span className="na-step-ic"><i className="fa-solid fa-check"></i></span><span>{s2.t}</span></div>
                ))}
              </div>
            </div>
          </div>
          <div className="na-assess-right">
      {(printAll || activeAgent === 0) && (
        <>
      {/* A — Event Intake & Categorisation (Agent 1) */}
      <div className="scenario-section-header">Event Intake & Categorisation</div>
      <div className="card" style={{marginBottom:16}}>
        {/* Synopsis */}
        <div style={{marginBottom:catBullets && catBullets.length > 0 ? 4 : 14}}>
          <div className="na-cat-k" style={{marginBottom:6}}>Summary</div>
          <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.65}}>
            <i className="fa-solid fa-newspaper" style={{color:'var(--primary)',marginRight:6}}></i>
            {catSynopsis}
          </div>
        </div>
        {/* Summary (bullets) */}
        {catBullets && catBullets.length > 0 && (
          <div style={{marginBottom:14}}>
            <ul style={{margin:0,paddingLeft:20,fontSize:13,color:'var(--text-2)',lineHeight:1.75}}>
              {catBullets.map((b, i) => <li key={i}>{b}</li>)}
            </ul>
          </div>
        )}
        {/* Extracted Entities */}
        <div style={{marginTop:6,marginBottom:12}}>
          <div className="na-cat-k" style={{marginBottom:6}}>Extracted Entities</div>
          {c.entities.map(e => <span key={e} className="na-chip">{e}</span>)}
        </div>
        {/* New cards: Trigger, Primary/Secondary Event Type, Geography, Velocity */}
        <div className="na-cat-cards" style={{marginBottom:12}}>
          {catTrigger && (
            <div className={`na-cat-card${c.registerMatch ? ' reg-matched' : ''}`}>
              <div className="na-cat-k">Trigger</div>
              <div className="na-cat-v" style={{fontSize:13}}>{catTrigger}</div>
              {c.registerMatch && (
                <div className="na-reg-tag"><i className="fa-solid fa-circle-check"></i><span>{c.registerMatch.id} — {c.registerMatch.title}</span></div>
              )}
            </div>
          )}
          {catPrimary && <div className="na-cat-card"><div className="na-cat-k">Primary Event Type</div><div className="na-cat-v" style={{fontSize:13}}>{catPrimary}</div></div>}
          {catSecondary && <div className="na-cat-card"><div className="na-cat-k">Secondary Event Type</div><div className="na-cat-v" style={{fontSize:13}}>{catSecondary}</div></div>}
          {c.extracted.filter(x => x.k === 'Geography').map(x => (
            <div key={x.k} className="na-cat-card"><div className="na-cat-k">Geography</div><div className="na-cat-v" style={{fontSize:13}}>{x.v}</div></div>
          ))}
          {catVelocity && <div className="na-cat-card"><div className="na-cat-k">Velocity</div><div className="na-cat-v" style={{fontSize:13}}>{catVelocity}</div></div>}
        </div>
        {/* Affected risk stripes */}
        {(() => {
          const stripes = (a3.affectedStripes && a3.affectedStripes.length) ? a3.affectedStripes : c.affectedStripes;
          return stripes && stripes.length > 0 && (
            <div style={{marginBottom:4}}>
              <div className="na-cat-k" style={{marginBottom:6}}>Affected Risk Stripes</div>
              {stripes.map(s => <span key={s} className="na-chip">{s}</span>)}
            </div>
          );
        })()}
      </div>
        </>
      )}

      {(printAll || activeAgent === 1) && (
        <>
      {/* B — Risk Event Flow (Agent 2) + human-in-the-loop */}
      <div className="scenario-section-header">Risk Event Flow</div>
      <div className="card" style={{marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--text-3)',marginBottom:14,display:'flex',alignItems:'center',gap:6}}>
          <i className="fa-solid fa-circle-info" style={{color:'var(--primary)'}}></i>
          Click any stage to view the risk detail. Primary and secondary risk stripes mapped from the register.
        </div>
        <div className="risk-flow">
          {d.flow.map((step, i) => (
            <React.Fragment key={i}>
              <div className={`risk-flow-step na-flow-uniform ${openFlow===i?'active-step':''}`} onClick={() => setOpenFlow(openFlow===i?null:i)} style={{cursor:'pointer'}}>
                {step.label}
                <span style={{marginLeft:8}}><i className={`fa-solid ${openFlow===i?'fa-circle-xmark':'fa-circle-info'}`} style={{fontSize:12,opacity:0.7}}></i></span>
              </div>
              {openFlow===i && (
                <div style={{maxWidth:560,margin:'2px auto 6px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',padding:'12px 16px',boxShadow:'var(--shadow)'}}>
                  <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>{step.detail}</div>
                  {step.signal && <div style={{marginTop:8,fontSize:11.5,color:'var(--primary-dark)',fontWeight:700}}>{step.signal}</div>}
                </div>
              )}
              {i < d.flow.length - 1 && <div className="risk-flow-arrow"><i className="fa-solid fa-chevron-down"></i></div>}
            </React.Fragment>
          ))}
        </div>
      </div>
        </>
      )}

      {(printAll || activeAgent === 2) && (
        <>
      {/* C — First Order Impact (Agent 3) */}
      <div className="scenario-section-header">First Order Impact</div>
      <div className="card" style={{marginBottom:16}}>
        {impactTable('fo', foAll)}
        {addStripeUI('fo')}
      </div>

      {/* D — Second Order Impact (Agent 3) */}
      <div className="scenario-section-header">Second Order Impact</div>
      <div className="card" style={{marginBottom:16}}>
        <div style={{fontSize:13,color:'var(--text-2)',marginBottom:12,lineHeight:1.6}}>
          Second-order impacts emerge as the initial shock propagates across adjacent risk stripes.
        </div>
        {impactTable('so', soAll)}
        {addStripeUI('so')}
      </div>

      {/* Human-in-the-loop validation (moved to Agent 3, after second-order impact) */}
      <div className="na-hitl">
        <div className="na-hitl-title"><i className="fa-solid fa-user-check"></i>Validate risk-stripe mapping</div>
        <div style={{fontSize:12.5,color:'#78350F',lineHeight:1.6}}>
          The pipeline mapped {d.flow.length} transmission stages and the first- and second-order risk stripes above. A risk owner should approve or reject the mapping before it is finalised.
        </div>
        {hitl === null && (
          <div className="na-hitl-actions">
            <button className="na-thumb up" onClick={() => setHitl('approved')}><i className="fa-solid fa-thumbs-up"></i> Approve</button>
            <button className="na-thumb down" onClick={() => setHitl('rejected')}><i className="fa-solid fa-thumbs-down"></i> Reject</button>
          </div>
        )}
        {hitl === 'approved' && (
          <div className="na-hitl-note"><i className="fa-solid fa-circle-check"></i>Mapping approved by risk owner.</div>
        )}
        {hitl === 'rejected' && (
          <div style={{marginTop:12}}>
            <textarea className="na-hitl-comment" placeholder="Add your comments…" value={hitlComment} onChange={e => setHitlComment(e.target.value)} />
            <div style={{display:'flex',gap:10,marginTop:8}}>
              <button className="na-thumb down" style={{padding:'7px 16px',fontSize:12}} disabled={!hitlComment.trim()} onClick={() => setHitl('sent')}><i className="fa-solid fa-paper-plane"></i> Submit</button>
              <button className="btn-outline" style={{fontSize:12,padding:'7px 16px'}} onClick={() => { setHitl(null); setHitlComment(''); }}>Cancel</button>
            </div>
          </div>
        )}
        {hitl === 'sent' && (
          <div className="na-hitl-note reject"><i className="fa-solid fa-circle-xmark"></i>Mapping rejected — comments recorded for review.</div>
        )}
      </div>
        </>
      )}

      {/* ── Agent 3b — Financial Impact & Escalation (Scope → Financial Impact) ── */}
      {(printAll || activeAgent === 3) && (
        <>
      {/* E — Scope and Exposure (Agent 3b) */}
      <div className="scenario-section-header">Scope and Exposure</div>
      <div className="scope-grid">
        {[
          { title:'Group Entities Impacted', items:d.scope.entities },
          { title:'Business Lines Impacted',  items:d.scope.businessLines },
          { title:'Instruments Impacted',     items:d.scope.instruments },
          { title:'Desks Impacted',           items:d.scope.desks },
        ].map(sc => (
          <div key={sc.title} className="scope-card">
            <div className="scope-card-title">{sc.title}</div>
            {sc.items.map((item, i) => (
              <div key={i} className="scope-card-item"><i className="fa-solid fa-circle-dot"></i>{item}</div>
            ))}
          </div>
        ))}
      </div>

      {/* F — Risk Transmission Map (from Excel, CME-Exchange-style tiered SVG) */}
      <div className="scenario-section-header">Risk Transmission Map — {ev.title}</div>
      {a3.map && a3.map.length > 0
        ? <NaTransMapCME map={a3.map} />
        : <div className="card" style={{marginBottom:16}}><div style={{fontSize:13,color:'var(--text-3)'}}>No transmission map data for this event.</div></div>}

      {/* H — Escalation Matrix (Agent 3) — from Excel */}
      <div className="scenario-section-header">Escalation Matrix</div>
      <div className="card" style={{marginBottom:16}}>
        <div className="impact-table-wrap">
          <table className="impact-table" style={{tableLayout:'fixed'}}>
            <colgroup><col style={{width:'24%'}} /><col style={{width:'11%'}} /><col style={{width:'30%'}} /><col style={{width:'18%'}} /><col style={{width:'17%'}} /></colgroup>
            <thead><tr><th>Risk Stripe/Area</th><th>Severity</th><th>Escalate To</th><th>Timeframe</th><th>Criticality</th></tr></thead>
            <tbody>
              {(a3.escalation || []).map((e, i) => {
                const crit = (e.criticality || '').toLowerCase();
                const critCls = crit === 'immediate' ? 'sev-critical' : crit === 'urgent' ? 'sev-high' : 'sev-medium';
                return (
                  <tr key={i}>
                    <td><strong>{e.stripe}</strong></td>
                    <td><span className={`sev-badge sev-${(e.severity||'').toLowerCase()}`}>{e.severity}</span></td>
                    <td>{e.escalateTo}</td>
                    <td style={{whiteSpace:'nowrap'}}>{e.timeframe}</td>
                    <td><span className={`sev-badge ${critCls}`}>{e.criticality}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Financial Impact Dashboard (Agent 3b) — structured charts from Excel */}
      {a3.financialRev && a3.financialRev.length > 0 ? (
        <>
          <div className="scenario-section-header">Financial Impact Dashboard</div>
          <div className="na-fin-grid">
            {a3.financialRev.map((c2, i) => (

  const copy = () => { if (briefing) navigator.clipboard?.writeText(briefing); };

    if (!briefing) return;
    const blob = new Blob([briefing], { type:'text/plain' });
    const a = document.createElement('a');

    a.download = `${type}-briefing.txt`;
    a.click();

    <div className="briefing-overlay" onClick={e => e.target===e.currentTarget && onClose()}>

          <div className="briefing-actions">
            <button className="btn-primary" style={{fontSize:13}} onClick={download}><i className="fa-solid fa-download"></i> Download</button>

function RtmEdge({ x1, y1, x2, y2 }) {

  return (

function RiskTransmissionMap() {
  const [phase, setPhase] = React.useState(0);

  // Phases:
  // 1=Trigger, 2=Scope, 3=Scope→L1 lines, 4=L1, 5=L1→L2 lines,
  // 6=L2, 7=L2→L3 lines, 8=L3, 9=L3→Meas lines, 10=Measurement,
  // 11=Meas→Impact lines, 12=Impact, 13=Action
  React.useEffect(() => {
    const delays = [400,1000,1650,2200,2800,3350,3900,4450,5050,5700,6350,7000,7650];
    const timers = delays.map((d, i) => setTimeout(() => setPhase(i + 1), d));
    return () => timers.forEach(clearTimeout);
  }, []);

  const rowStyle   = (minPhase) => ({ opacity: phase >= minPhase ? 1 : 0, transition: 'opacity 0.5s' });
  const edgeStyle  = (minPhase) => ({ opacity: phase >= minPhase ? 1 : 0, transition: 'opacity 0.45s' });

  const S  = { fill: '#2a1f10', stroke: '#c8855a', textFill: '#f0c880' };

  const midY = (y, h) => y + (h || NH) / 2;

  const nodes = {

    mcs:  { x:334, y:Y.meas, w:68,  h:36, ...MR, t:'CS01' },
    mf:   { x:409, y:Y.meas, w:128, h:36, ...MR, t:'FX net short', t2:'position' },
    mep:  { x:544, y:Y.meas, w:126, h:36, ...MR, t:'Exposure/', t2:'Position' },
    mpe:  { x:686, y:Y.meas, w:68,  h:36, ...MN, t:'PFE' },
    mva:  { x:761, y:Y.meas, w:68,  h:36, ...MN, t:'CVA' },
    mpd:  { x:836, y:Y.meas, w:60,  h:36, ...MN, t:'PD' },
    mel:  { x:903, y:Y.meas, w:60,  h:36, ...MN, t:'ECL' },

    ir1:  { x:146, y:Y.imp, w:70,  h:NH, ...S,  t:'RWA' },
    ic1:  { x:223, y:Y.imp, w:80,  h:NH, ...S,  t:'Capital' },
    ip1:  { x:310, y:Y.imp, w:60,  h:NH, ...S,  t:'PnL' },
    ir2:  { x:432, y:Y.imp, w:70,  h:NH, ...S,  t:'RWA' },
    ic2:  { x:509, y:Y.imp, w:80,  h:NH, ...S,  t:'Capital' },
    ip2:  { x:596, y:Y.imp, w:60,  h:NH, ...S,  t:'PnL' },
    icf:  { x:706, y:Y.imp, w:108, h:NH, ...S,  t:'Cost of', t2:'funds' },
    ish:  { x:822, y:Y.imp, w:126, h:NH, ...S,  t:'Survival', t2:'Horizon' },
    ip3:  { x:958, y:Y.imp, w:60,  h:NH, ...S,  t:'PnL' },
  };

  const ncx  = (id) => nodes[id].x + nodes[id].w / 2;
  const nbot = (id) => nodes[id].y + nodes[id].h;
  const ntop = (id) => nodes[id].y;

  // Edge groups — lines appear AFTER both connected rows are visible
  const edgeGroups = [
    { phase: 4,  pairs: [['sg','l1tr'],['sbl','l1tr'],['sle','l1cr'],['sins','l1cr'],['sins','l1or'],['sde','l1or'],['sib','l1ty']] },
    { phase: 6,  pairs: [['l1tr','l2mr'],['l1cr','l2cc'],['l1cr','l2co'],['l1cr','l2cm'],['l1ty','l2lq']] },
    { phase: 8,  pairs: [['l2mr','l3fx'],['l2mr','l3eq'],['l2mr','l3ir'],['l2mr','l3cs'],['l2cc','l3dc'],['l2co','l3co'],['l2cm','l3co'],['l2lq','l3mc'],['l2lq','l3al']] },
    { phase: 10, pairs: [['l3fx','mv'],['l3eq','mv'],['l3ir','mv'],['l3ir','mp'],['l3cs','mcs'],['l3fx','mf'],['l3dc','mep'],['l3co','mpe'],['l3co','mva'],['l3mc','mpd'],['l3al','mel']] },
    { phase: 12, pairs: [['mv','ir1'],['mv','ic1'],['mp','ir1'],['mcs','ip1'],['mep','ir2'],['mep','ic2'],['mpe','ip2'],['mva','ic2'],['mpd','icf'],['mel','ish']] },
  ];

  const scopeRow = ['sg','sle','sbl','sins','sde','sib'];
  const l1Row    = ['l1tr','l1cr','l1or','l1ty'];
  const l2Row    = ['l2mr','l2cc','l2co','l2cm','l2lq'];
  const l3Row    = ['l3fx','l3eq','l3ir','l3cs','l3dc','l3co','l3mc','l3al'];
  const measRow  = ['mv','mp','mcs','mf','mep','mpe','mva','mpd','mel'];
  const impRow   = ['ir1','ic1','ip1','ir2','ic2','ip2','icf','ish','ip3'];

  return (
    <div className="rtm-wrap">
      <div className="rtm-canvas-wrap">
        <svg viewBox="0 0 1050 588" preserveAspectRatio="xMidYMid meet"
          xmlns="http://www.w3.org/2000/svg" style={{ width:'100%', height:'auto', fontFamily:'inherit' }}>

          {/* Edge groups — each fades in at its own phase */}
          {edgeGroups.map((grp) => (
            <g key={grp.phase} style={edgeStyle(grp.phase)}>
              {grp.pairs.map(([a,b], i) => (
                <RtmEdge key={i} x1={ncx(a)} y1={nbot(a)} x2={ncx(b)} y2={ntop(b)} />
              ))}
            </g>
          ))}

          {/* Phase 1 — Trigger */}
          <g style={rowStyle(1)}>
            <RtmLabel x={128} y={midY(Y.trig)} label="Trigger" />
            <rect x={180} y={Y.trig} width={860} height={NH} rx={5} fill="#2d1e0c" stroke="#8B5e30" strokeWidth={1.5} />
            <text x={610} y={midY(Y.trig)+1} textAnchor="middle" dominantBaseline="middle"
              fontSize={11} fontWeight="700" fill="#ffcf88" fontFamily="inherit">
              Closure of an exchange due to a cyber attack (CME Exchange Failure)
            </text>
          </g>

          {/* Phase 2 — Scope */}
          <g style={rowStyle(2)}>
            <RtmLabel x={128} y={midY(Y.scope)} label="Scope" />
            {scopeRow.map(id => <RtmBox key={id} {...nodes[id]} />)}
          </g>

          {/* Phase 3 — Risk Stripe L1 + bracket */}
          <g style={rowStyle(3)}>
            <rect x={131} y={Y.l1-2} width={3} height={(Y.l3+NH)-(Y.l1-2)} rx={1.5} fill="#c0392b" opacity={0.8} />
            <RtmLabel x={128} y={midY(Y.l1)} label="Risk Stripe L1" />
            {l1Row.map(id => <RtmBox key={id} {...nodes[id]} />)}
          </g>

          {/* Phase 5 — Risk Stripe L2 */}
          <g style={rowStyle(5)}>
            <RtmLabel x={128} y={midY(Y.l2)} label="Risk Stripe L2" />
            {l2Row.map(id => <RtmBox key={id} {...nodes[id]} />)}
          </g>

          {/* Phase 7 — Risk Stripe L3 */}
          <g style={rowStyle(7)}>
            <RtmLabel x={128} y={midY(Y.l3)} label="Risk Stripe L3" />
            {l3Row.map(id => <RtmBox key={id} {...nodes[id]} />)}
          </g>

          {/* Phase 9 — Risk Measurement */}
          <g style={rowStyle(9)}>
            <RtmLabel x={128} y={midY(Y.meas, 36)} label="Risk Measurement" />
            {measRow.map(id => <RtmBox key={id} {...nodes[id]} />)}
          </g>

          {/* Phase 11 — Impact */}
          <g style={rowStyle(11)}>
            <RtmLabel x={128} y={midY(Y.imp)} label="Impact" />
            {impRow.map(id => <RtmBox key={id} {...nodes[id]} />)}
            <rect x={146} y={Y.lim} width={872} height={22} rx={4} fill="#2a1f10" stroke="#c8855a" strokeWidth={1} />
            <text x={582} y={Y.lim+11} textAnchor="middle" dominantBaseline="middle"
              fontSize={10} fontWeight="600" fill="#f0c880" fontFamily="inherit">Limit breaches</text>
          </g>

          {/* Phase 13 — Action */}
          <g style={rowStyle(13)}>
            <RtmLabel x={128} y={midY(Y.act)} label="Action" />
            <rect x={180} y={Y.act} width={720} height={NH} rx={5} fill="#2a1f10" stroke="#c8855a" strokeWidth={1.5} />
            <text x={540} y={midY(Y.act)+1} textAnchor="middle" dominantBaseline="middle"
              fontSize={10.5} fontWeight="600" fill="#f0c880" fontFamily="inherit">
              Proposed actions: Lowering of limits, winding down trades,
            </text>
          </g>

        </svg>
      </div>
    </div>
  );
}

// ── Source Data Drill-Down Component ─────────────────────────────────────────
function SourceDataSection() {
  const [data,   setData]   = useState(null);
  const [open,   setOpen]   = useState({});
  const [loaded, setLoaded] = useState(false);

  const load = async () => {
    if (loaded) return;
    try {
      const r = await fetch('/api/scenario/source-data');
      const j = await r.json();
      setData(j);
    } catch (e) { setData({}); }
    setLoaded(true);
  };

  const toggle = (key) => {
    if (!loaded) load();
    setOpen(p => ({ ...p, [key]: !p[key] }));
  };

  const DATASETS = [
    { key: 'trade_register',       icon: 'fa-table-list',   label: 'CME Trade Register',             desc: '31 open positions across 5 desks exposed to CME',       color: '#3B82F6' },
    { key: 'margin_ledger',        icon: 'fa-vault',        label: 'CCP Margin Ledger',              desc: '12 margin accounts — IM/VM frozen at CME ($19.5Bn)',    color: '#DC2626' },
    { key: 'platform_mapping',     icon: 'fa-network-wired',label: 'Platform & Terminal Mapping',    desc: '12 trading platforms — status at T0 and BCDR routes',   color: '#D97706' },
    { key: 'scenario_assumptions', icon: 'fa-sliders',      label: 'Scenario Assumptions & Parameters', desc: '28 stress parameters underpinning all scenario metrics', color: '#16A34A' },
  ];

  const statusClass = (val) => {
    if (!val) return '';
    const v = String(val).toUpperCase();
    if (v === 'FROZEN')   return 'src-status-frozen';
    if (v === 'PARTIAL')  return 'src-status-partial';
    if (v === 'DOWN')     return 'src-status-down';
    if (v === 'DEGRADED') return 'src-status-degraded';
    if (v === 'ACTIVE' || v === 'ACTIVATED' || v === 'OPERATIONAL') return 'src-status-active';
    return '';
  };

  const statusKeys = new Set(['Status_at_T0','Status_T0','Status_PreEvent','Status','status']);

  const renderTable = (rows) => {
    if (!rows || rows.length === 0) return <div style={{padding:14,color:'var(--text-3)',fontSize:12}}>No data available.</div>;
    const cols = Object.keys(rows[0]);
    return (
      <div className="src-table-wrap" style={{maxHeight:320,overflowY:'auto'}}>
        <table className="src-table">
          <thead>
            <tr>{cols.map(c => <th key={c}>{c.replace(/_/g,' ')}</th>)}</tr>
          </thead>
          <tbody>
            {rows.map((row, i) => (
              <tr key={i}>
                {cols.map(c => {
                  const val = row[c];
                  const sc  = statusKeys.has(c) ? statusClass(val) : '';
                  return <td key={c} className={sc}>{val === null || val === undefined ? '—' : String(val)}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div className="src-section">
      {DATASETS.map(ds => (
        <div key={ds.key} style={{marginBottom:8}}>
          <div className="src-dataset-header" onClick={() => toggle(ds.key)}>
            <div className="src-dataset-title">
              <i className={`fa-solid ${ds.icon}`} style={{color:ds.color,fontSize:14}}></i>
              {ds.label}
              <span className="src-dataset-badge">{data && data[ds.key] ? data[ds.key].length + ' rows' : 'click to load'}</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <span className="src-dataset-meta">{ds.desc}</span>
              <i className={`fa-solid ${open[ds.key] ? 'fa-chevron-up' : 'fa-chevron-down'}`} style={{fontSize:11,color:'var(--text-3)'}}></i>
            </div>
          </div>
          {open[ds.key] && (
            !loaded
              ? <div style={{padding:14,fontSize:12,color:'var(--text-3)'}}>Loading…</div>
              : renderTable(data?.[ds.key])
          )}
        </div>
      ))}
    </div>
  );
}

      {/* Section J — Action Playbook */}
      <SectionHeader letter="K" title="Management Action Playbook" />
      <div className="card" style={{marginBottom:16}}>
        <div className="action-tabs">
          {ACTION_TABS.map(t => (
            <button key={t.id} className={`action-tab ${actionTab===t.id?'active':''}`}
              onClick={() => { setActionTab(t.id); setExpandedAction(null); }}>
              {t.label}
              <span style={{marginLeft:6,background:'rgba(0,0,0,0.07)',borderRadius:10,padding:'1px 7px',fontSize:10,fontWeight:700}}>
                {(ACTIONS[t.id]||[]).length}

        <div className="playbook-toolbar">

            {(ACTIONS[actionTab]||[]).length} actions · click any row to expand detail
          </span>
          <div className="playbook-toolbar-btns">
            <button className="btn-outline" style={{fontSize:12,padding:'6px 14px'}}
              onClick={() => { setExpandAll(p => !p); setExpandedAction(null); }}>
              <i className={`fa-solid ${expandAll ? 'fa-compress' : 'fa-expand'}`}></i>
              {expandAll ? 'Collapse All' : 'Expand All'}
            </button>
            <button className="btn-primary" style={{fontSize:12,padding:'6px 14px'}}
              onClick={generateActionSummary} disabled={summaryLoading}>

                : <><i className="fa-solid fa-wand-magic-sparkles"></i> Generate Action Summary</>}
            </button>
          </div>
        </div>

        <div>
          {(ACTIONS[actionTab]||[]).map((action, i) => (
            <ActionRow
              key={i} action={action} idx={i}
              isExpanded={isExpanded(actionTab, i)}
              onToggle={() => toggleAction(actionTab, i)}

        {(actionSummary || summaryLoading) && (
          <div className="action-summary-panel">
            <div className="action-summary-header">
              <i className="fa-solid fa-wand-magic-sparkles"></i>
              AI Action Summary
              {summaryLoading && <div className="spinner" style={{width:12,height:12,borderWidth:2,marginLeft:6}}></div>}
            </div>
            {actionSummary && <div>{actionSummary}</div>}
          </div>
        )}
      </div>

    </div>
  );
}

function ArchegosDashboard({ onBack }) {
  const [data,           setData]           = useState(null);
  const [loading,        setLoading]        = useState(true);
  const [actionTab,      setActionTab]      = useState('immediate');
  const [expandedAction, setExpandedAction] = useState(null);
  const [expandAll,      setExpandAll]      = useState(false);
  const [openFlow,       setOpenFlow]       = useState(null);

  useEffect(() => {
    fetch('/api/scenario/archegos').then(r => r.json()).then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  const SectionHeader = ({ letter, title }) => (
    <div className="scenario-section-header"><span className="section-letter">{letter}</span>{title}</div>
  );

  const toggleAction = (tab, idx) => setExpandedAction(prev => prev?.tab===tab && prev?.idx===idx ? null : { tab, idx });
  const isExpanded   = (tab, idx) => expandAll || (expandedAction?.tab===tab && expandedAction?.idx===idx);

  // ── Chart helpers ──────────────────────────────────────────────────────────
  const ArchegosLineChart = ({ rows, xKey, series, title }) => {
    const ref = React.useRef(null);
    const chartRef = React.useRef(null);
    useEffect(() => {
      if (!rows || !rows.length || !ref.current) return;
      if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
      const labels = rows.map(r => r[xKey] != null ? String(r[xKey]) : '');
      const COLS = ['#FFAD28','#3B82F6','#EF4444','#10B981','#8B5CF6','#F59E0B'];
      const datasets = series.map((s, i) => ({
        label: s.label, data: rows.map(r => r[s.key]),
        borderColor: COLS[i % COLS.length], backgroundColor: COLS[i % COLS.length] + '22',
        borderWidth: 2, tension: 0.3, fill: s.fill || false, pointRadius: 3,
        borderDash: s.dash ? [5,3] : undefined,
      }));
      chartRef.current = new Chart(ref.current, { type:'line', data:{ labels, datasets },
        options:{ responsive:true, plugins:{ legend:{ labels:{ color:'#1E293B', font:{ size:11 } } } },
          scales:{ x:{ ticks:{ color:'#334155', font:{ size:10 } }, grid:{ color:'rgba(0,0,0,0.08)' } },
                   y:{ ticks:{ color:'#334155', font:{ size:10 } }, grid:{ color:'rgba(0,0,0,0.08)' } } } } });
      return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    }, [rows]);
    return <canvas ref={ref} style={{maxHeight:220}}></canvas>;
  };

  const ArchegosBarChart = ({ rows, labelKey, valueKeys, title }) => {
    const ref = React.useRef(null);
    const chartRef = React.useRef(null);
    useEffect(() => {
      if (!rows || !rows.length || !ref.current) return;
      if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
      const labels = rows.map(r => r[labelKey] != null ? String(r[labelKey]) : '');
      const COLS = ['#FFAD28','#3B82F6','#EF4444','#10B981','#8B5CF6'];
      const datasets = valueKeys.map((vk, i) => ({
        label: vk.label, data: rows.map(r => r[vk.key]),
        backgroundColor: COLS[i % COLS.length] + 'cc', borderRadius: 4,
      }));
      chartRef.current = new Chart(ref.current, { type:'bar', data:{ labels, datasets },
        options:{ responsive:true, plugins:{ legend:{ labels:{ color:'#1E293B', font:{ size:11 } } } },
          scales:{ x:{ ticks:{ color:'#334155', font:{ size:10 }, maxRotation:35 }, grid:{ color:'rgba(0,0,0,0.08)' } },
                   y:{ ticks:{ color:'#334155', font:{ size:10 } }, grid:{ color:'rgba(0,0,0,0.08)' } } } } });
      return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    }, [rows]);
    return <canvas ref={ref} style={{maxHeight:220}}></canvas>;
  };

  const DataTable = ({ rows, cols, maxH }) => {
    if (!rows || !rows.length) return <div style={{padding:12,color:'var(--text-3)',fontSize:12}}>No data.</div>;
    const headers = cols || Object.keys(rows[0]);
    const excelToDate = n => { const d = new Date(Math.round((n - 25569) * 86400 * 1000)); return d.toISOString().slice(0,10); };
    const numFmt = (v, h) => { if (typeof v === 'number' && String(h||'').toLowerCase().includes('date') && v > 40000 && v < 60000) return excelToDate(v); return typeof v === 'number' ? (Math.abs(v) > 100 ? v.toLocaleString() : v.toFixed(2)) : (v ?? '—'); };
    const sevColor = v => { const s=String(v||'').toLowerCase(); if(s.includes('critical'))return'#EF4444'; if(s.includes('high'))return'#F59E0B'; if(s.includes('medium'))return'#3B82F6'; return ''; };
    return (
      <div style={{overflowX:'auto',overflowY:'auto',maxHeight:maxH||260,borderRadius:6,border:'1px solid var(--border)'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11.5}}>
          <thead>
            <tr>{headers.map(h=><th key={h} style={{padding:'7px 10px',textAlign:'left',fontWeight:600,color:'var(--text-2)',borderBottom:'1px solid var(--border)',background:'var(--surface)',whiteSpace:'nowrap',position:'sticky',top:0}}>{String(h).replace(/_/g,' ')}</th>)}</tr>
          </thead>
          <tbody>
            {rows.map((row,i)=>(
              <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                {headers.map(h=>{
                  const v=row[h]; const sc=sevColor(v);
                  return <td key={h} style={{padding:'6px 10px',color:sc||'var(--text)',whiteSpace:'nowrap',fontWeight:sc?700:400}}>{numFmt(v,h)}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  const HeatTable = ({ rows, rowKey, colKeys }) => {
    if (!rows || !rows.length) return null;
    const colorCell = v => {
      if (v == null) return '';
      const n = typeof v === 'number' ? v : parseFloat(v);
      if (isNaN(n)) return '';
      const pct = Math.min(Math.abs(n) / 10000, 1);
      return `rgba(239,68,68,${0.1 + pct * 0.85})`;
    };
    return (
      <div style={{overflowX:'auto',borderRadius:6,border:'1px solid var(--border)'}}>
        <table style={{borderCollapse:'collapse',fontSize:11}}>
          <thead>
            <tr>
              <th style={{padding:'6px 10px',background:'var(--surface)',fontWeight:600,color:'var(--text-2)',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap'}}>Bank</th>

          </thead>
          <tbody>
            {rows.map((row,i)=>(

              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  const sh = k => (data && data[k]) || [];

  const liqRows  = sh('05_Position_vs_Liquidity');

  const hhiRows  = sh('08_Concentration_HHI');

  const callXKey  = callRows[0] ? Object.keys(callRows[0])[0] : 'Scenario Day';
  const capKeys   = capRows[0]  ? Object.keys(capRows[0]).slice(3) : [];
  const callBanks = callRows[0] ? Object.keys(callRows[0]).slice(2).filter(k => k !== 'TOTAL All Banks ($mm)' && !k.toLowerCase().includes('total')) : [];
  const hmRowKey  = hmRows[0]   ? Object.keys(hmRows[0])[0] : 'Bank \\ Ticker';
  const hmColKeys = hmRows[0]   ? Object.keys(hmRows[0]).slice(1).filter(k => !k.toLowerCase().includes('total')) : [];
  const liqLabelKey = liqRows[0] ? Object.keys(liqRows[0])[0] : 'Ticker';
  const hhiBankRows = hhiRows.filter(r => { const v = Object.values(r)[0]; return v && !String(v).toLowerCase().includes('bank') && String(v).length < 30 && !String(v).includes('HHI') && !String(v).includes('Name'); }).slice(0, 6);

  return (
    <div className="page scenario-light" style={{maxWidth:1240}}>
      {/* Back button */}
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:20}}>
        <button className="btn-outline" style={{fontSize:13}} onClick={onBack}>
          <i className="fa-solid fa-arrow-left"></i> Scenario Library

        <div style={{flex:1}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'var(--text-3)',marginBottom:2}}>Scenario 05 · Historical Case</div>
          <div style={{fontSize:18,fontWeight:800,color:'var(--text)',lineHeight:1.2}}>Archegos Capital — Wrong Way Risk &amp; Concentration Failure</div>

        <span className="sev-badge sev-critical">Critical</span>

      {/* Meta KPIs */}
      <div className="scenario-meta-grid" style={{marginBottom:20}}>
        {ARCHEGOS_META.map((m,i) => (
          <div key={i} className="scenario-meta-card">
            <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.7px',color:'var(--text-3)',marginBottom:4}}>{m.label}</div>
            <div style={{fontSize:13,fontWeight:700,color: m.cls==='critical'?'#EF4444': m.cls==='warning'?'#F59E0B':'var(--text)'}}>{m.value}</div>
          </div>
        ))}
      </div>

      {/* Section A — Executive Summary */}
      <SectionHeader letter="A" title="Executive Summary" />
      <div className="card" style={{marginBottom:16,lineHeight:1.7,fontSize:13.5,color:'var(--text-2)'}}>
        <strong style={{color:'var(--text)'}}>Archegos Capital Management</strong> was a family office run by Bill Hwang that built an estimated <strong>$30Bn+ notional exposure</strong> across 10 concentrated equity names through Total Return Swaps (TRS) with 6 prime brokers simultaneously — with no single broker aware of the full picture. When <strong>ViacomCBS (VIAC) fell ~55%</strong> in March 2021, simultaneous margin calls from all 6 banks could not be met. The resulting forced liquidation of the same names by competing banks created a self-reinforcing price collapse — a textbook <strong>Wrong Way Risk (WWR)</strong> event. Total bank losses exceeded <strong>$10Bn</strong>, with Credit Suisse losing $4.7Bn and Nomura $2.9Bn. This scenario stress-tests counterparty credit concentration, cross-dealer visibility gaps, and prime brokerage margin adequacy.
      </div>

      {/* Section B — Risk Transmission */}
      <SectionHeader letter="B" title="Risk Transmission — How the Failure Cascaded" />
      <div className="card" style={{marginBottom:16}}>
        {(() => {
          // Parse txRows: find numbered headings (e.g. "1. ViacomCBS...") and pair with next row as detail

            txRows.forEach((row, idx) => {

function ScenarioPage() {
  const [selected,           setSelected]           = useState(101); // open News Intelligence directly (no card grid)
  const [transitioning,      setTransitioning]      = useState(false);
  const [scenarioData,       setScenarioData]       = useState(null);
  const [chartData,          setChartData]          = useState(null);
  const [loading,            setLoading]            = useState(true);
  const [showBriefing,       setShowBriefing]       = useState(false);
  const [briefingType,       setBriefingType]       = useState(null);
  const [briefing,           setBriefing]           = useState(null);
  const [generatingBriefing, setGeneratingBriefing] = useState(false);

  useEffect(() => {
    Promise.all([
      fetch('/api/scenario/data').then(r => r.json()).catch(() => ({ available:false })),
      fetch('/api/scenario/chart-data').then(r => r.json()).catch(() => ({ available:false }))
    ]).then(([doc, charts]) => {
      setScenarioData(doc);
      setChartData(charts);
      setLoading(false);
    });
  }, []);

  const handleSelect = async (id) => {
    setTransitioning(true);
    // News Intelligence and Impact Assessment opens quickly — its own run animation is the main event.
    if (id === 101) { await minDelay(1200, 2000); }
    else { await minDelay(10000, 15000); }
    setSelected(id);
    setTransitioning(false);
  };

  const generateBriefing = async (type) => {
    setBriefingType(type);
    setGeneratingBriefing(true);
    setShowBriefing(true);
    setBriefing(null);
    try {
      const [res] = await Promise.all([
        fetch('/api/scenario/briefing', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ type }) }),
        minDelay(8000, 20000)
      ]);
      const data = await res.json();
      setBriefing(data.briefing);
    } catch (err) {
      setBriefing('Failed to generate briefing: ' + err.message);
    } finally {
      setGeneratingBriefing(false);
    }
  };

  if (loading) return <div className="page"><div className="spinner-wrap"><div className="spinner"></div> Loading scenario data…</div></div>;

  if (transitioning) return (
    <div className="scenario-light" style={{position:'fixed',top:58,left:0,right:0,bottom:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:999,background:'#F1F5F9'}}>
      <div style={{width:'100%',maxWidth:520,padding:'0 24px'}}>
      <ProcessingView
        title="Loading Scenario Dashboard"
        icon="fa-radiation"
        messages={[
          'Initialising stress scenario engine…',
          'Loading risk transmission model…',
          'Fetching quantification parameters…',
          'Building war-room dashboard…',
          'Resolving regulatory notification matrix…',
          'Preparing scenario intelligence data…',
        ]}
      />
      </div>
    </div>
  );

  if (!selected) return <ScenarioLibrary onSelect={handleSelect} />;

  if (selected === 5) {
    return <ArchegosDashboard onBack={() => setSelected(null)} />;
  }

  if (selected === 101) {
    return <NewsAssessment onBack={() => setSelected(null)} />;
  }

  if (selected !== 4) {
    return (
      <div className="page">
        <button className="btn-outline" style={{marginBottom:20,fontSize:13}} onClick={() => setSelected(null)}>
          <i className="fa-solid fa-arrow-left"></i> Scenario Library
        </button>
        <div className="card" style={{textAlign:'center',padding:'64px 40px'}}>
          <div style={{fontSize:40,marginBottom:16,color:'var(--border)'}}>🚧</div>
          <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Detailed dashboard coming soon</div>
          <div style={{color:'var(--text-2)',fontSize:14}}>This scenario is currently in development. Please check back in a future release.</div>
        </div>
      </div>
    );
  }

  return (
    <CMEDashboard
      scenarioData={scenarioData}
      chartData={chartData}
      onBack={() => setSelected(null)}
      onGenerateBriefing={generateBriefing}
      briefing={briefing}
      briefingType={briefingType}
      generatingBriefing={generatingBriefing}
      showBriefing={showBriefing}
      setShowBriefing={setShowBriefing}
    />
  );
}

const SCATTER_COLORS = ['#FFAD28','#1E3A5F','#059669','#FFAD28','#7C3AED','#DB2777','#0284C7','#0F766E'];
const CLUSTER_BORDER_COLORS = ['#CC8A1E','#162D4A','#047857','#CC8A1E','#6D28D9','#BE185D','#0369A1','#0F5C55'];

function getPctKey(row) {
  return Object.keys(row).find(k => k.toLowerCase().includes('pct') && k.toLowerCase().includes('100')) || '';
}

function riskPillClass(r) {
  const s = String(r).toLowerCase();
  if (s.includes('critical')) return 'critical';
  if (s.includes('high'))     return 'high';
  if (s.includes('medium') || s.includes('med')) return 'medium';
  if (s.includes('low'))      return 'low';
  return '';
}

function statusPillClass(s) {
  const v = String(s).toLowerCase();
  if (v.includes('escal') || v.includes('mlro')) return 'escalated';
  if (v.includes('invest'))   return 'invest';
  if (v.includes('monitor'))  return 'monitor';
  return '';
}

function riskCardClass(s) {
  const v = String(s).toLowerCase();
  if (v.includes('high') || v.includes('critical')) return 'high';
  if (v.includes('medium')) return 'medium';
  return 'low';
}

function ScatterPlotChart({ data, xCol, yCol }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  const isCurrency = col => col && (col.toLowerCase().includes('gbp') || col.toLowerCase().includes('amount'));
  const formatVal  = (col, v) => isCurrency(col) ? `£${Number(v).toLocaleString()}` : Number(v).toLocaleString();

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    if (!data || !data.length || !xCol || !yCol) return;

    const clusters = {};
    data.forEach(row => {
      const label = String(row['Cluster Label'] || row['Cluster'] || 'Unknown');
      if (!clusters[label]) clusters[label] = [];
      clusters[label].push(row);
    });

    const clusterList = Object.keys(clusters);

    const config = {
      type: 'scatter',
      data: {
        datasets: clusterList.map((label, idx) => ({
          label,
          data: clusters[label].map(r => {
            const pctKey = getPctKey(r);
            return {
              x: parseFloat(r[xCol]) || 0,
              y: parseFloat(r[yCol]) || 0,
              partyId:     r['Party ID'],
              riskRating:  r['Risk Rating'],
              crossBorder: r['Cross-Border TXN Count'],
              pctAbove:    pctKey ? r[pctKey] : null,
              distance:    r['Distance from Centroid'],
              flag:        r['Flag / Note'] || r['Flag  Note'] || ''
            };
          }),
          backgroundColor: SCATTER_COLORS[idx % SCATTER_COLORS.length] + 'BB',
          borderColor:     SCATTER_COLORS[idx % SCATTER_COLORS.length],
          pointRadius: 7, pointHoverRadius: 11, borderWidth: 1.5
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, padding: 14, color: '#1E293B' } },
          title: { display: false },
          tooltip: {
            callbacks: {
              title: items => items.length ? `Party: ${items[0].raw.partyId || 'N/A'}` : '',
              label: ctx => {
                const p = ctx.raw;
                const pct = p.pctAbove !== null && p.pctAbove !== undefined
                  ? (parseFloat(p.pctAbove) <= 1 ? (parseFloat(p.pctAbove)*100).toFixed(1)+'%' : parseFloat(p.pctAbove).toFixed(1)+'%')
                  : 'N/A';
                return [
                  `Cluster: ${ctx.dataset.label}`,
                  `Risk Rating: ${p.riskRating || 'N/A'}`,
                  `${xCol}: ${formatVal(xCol, p.x)}`,
                  `${yCol}: ${formatVal(yCol, p.y)}`,
                  `Cross-Border TXN: ${p.crossBorder ?? 'N/A'}`,
                  `>£100K: ${pct}`,
                  `Distance from Centroid: ${typeof p.distance === 'number' ? p.distance.toFixed(2) : (p.distance ?? 'N/A')}`,
                  ...(p.flag ? [`Flag: ${p.flag}`] : [])
                ];
              }
            },
            backgroundColor: 'rgba(15,23,42,0.93)',
            titleColor: '#fff', bodyColor: 'rgba(255,255,255,0.82)',
            padding: 12, cornerRadius: 8, displayColors: true
          }
        },
        scales: {
          x: {
            title: { display: true, text: xCol, font: { family: 'Inter', size: 12 }, color: '#334155'},
            ticks: { callback: v => formatVal(xCol, v), font: { family: 'Inter', size: 11 }, color: '#334155'},
            grid: { color: 'rgba(0,0,0,0.08)' }
          },
          y: {
            title: { display: true, text: yCol, font: { family: 'Inter', size: 12 }, color: '#334155'},
            ticks: { callback: v => formatVal(yCol, v), font: { family: 'Inter', size: 11 }, color: '#334155'},
            grid: { color: 'rgba(0,0,0,0.08)' }
          }
        }
      }
    };
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), config);
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(data), xCol, yCol]);

  if (!data || !data.length || !xCol || !yCol) return <div style={{padding:30,color:'var(--text-3)',textAlign:'center'}}>No scatter data to display.</div>;
  return <div style={{position:'relative',height:420}}><canvas ref={canvasRef}></canvas></div>;
}

function buildAnomalyNarrative(a) {
  const riskRating   = String(a['Risk Rating'] || '');
  const clusterLabel = a['Cluster Label'] || a['Cluster'] || '';
  const anomalyType  = a['Anomaly Type'] || '';
  const distRaw      = parseFloat(a['Distance from Centroid']);
  const dist         = isNaN(distRaw) ? null : distRaw;
  const status       = a['Investigation Status'] || '';
  const topFeats     = a['Top Features'] || '';
  const amlNarrative = a['Notes / AML Narrative'] || a['Notes  AML Narrative'] || '';
  const isHighRisk   = /(high|critical)/i.test(riskRating);
  const isEscalated  = /(mlro|escal)/i.test(status);

  let behaviouralPattern;
  if (amlNarrative) {
    behaviouralPattern = amlNarrative;
  } else if (anomalyType && dist !== null) {
    const severity = dist > 5 ? 'materially elevated' : dist > 2 ? 'elevated' : 'moderate';
    behaviouralPattern = `Party exhibits ${severity} behavioural deviation from its cluster centroid (distance: ${dist.toFixed(2)}), consistent with ${anomalyType} typology indicators. Behaviour suggests deviation from expected activity profile within the ${clusterLabel || 'assigned'} cluster.`;
  } else {
    behaviouralPattern = 'Not available in source dataset.';
  }

  const keyDrivers = topFeats || 'Not available in source dataset.';

  let riskIndicatorParts = [];
  if (anomalyType) riskIndicatorParts.push(`Anomaly classification: ${anomalyType}`);
  if (dist !== null) {
    const level = dist > 5 ? 'high' : dist > 2 ? 'moderate' : 'low';
    riskIndicatorParts.push(`Centroid distance indicates ${level} behavioural deviation from cluster norm`);
  }
  if (isHighRisk) riskIndicatorParts.push(`${riskRating} risk rating indicates elevated monitoring attention`);
  if (clusterLabel) riskIndicatorParts.push(`Cluster assignment: ${clusterLabel}`);
  const riskIndicators = riskIndicatorParts.length
    ? riskIndicatorParts.join('. ') + '. Pattern may warrant further investigation against customer profile, expected activity documentation, and supporting transaction evidence.'
    : 'Not available in source dataset.';

  let reviewFocus;
  if (isEscalated) {
    reviewFocus = 'Case is currently escalated. Validate all supporting documentation, transaction purpose, counterparty relationships, and source of funds evidence before determining next action or regulatory notification requirement.';
  } else if (isHighRisk) {
    reviewFocus = 'Enhanced due diligence review is indicated given the High risk rating. Validate transaction purpose, counterparty profile, source of funds, and any linked trade documentation. Consider whether escalation thresholds have been met.';
  } else {
    reviewFocus = 'Review transaction patterns against customer profile and expected activity thresholds. Confirm monitoring disposition and validate supporting evidence before case closure or status update.';
  }

  return { behaviouralPattern, keyDrivers, riskIndicators, investigationStatus: status || 'Not available in source dataset.', reviewFocus };
}

function parseInsightsSections(text) {
  if (!text) return [];
  const lines = text.split('\n');
  const sections = [];
  let cur = null;
  for (const line of lines) {
    const m = line.match(/^(\d+)\.\s+([^:]+):\s*(.*)/);
    if (m) {
      if (cur) sections.push(cur);
      cur = { num: m[1], label: m[2].trim(), content: m[3].trim() };
    } else if (cur && line.trim()) {
      cur.content += (cur.content ? ' ' : '') + line.trim();
    }
  }
  if (cur) sections.push(cur);
  return sections;
}

function classifClass(c) {
  if (!c) return '';
  const v = c.toLowerCase();
  if (v.includes('confidential')) return 'classif-confidential';
  if (v.includes('restrict'))     return 'classif-restricted';
  if (v.includes('internal'))     return 'classif-internal';
  if (v.includes('public'))       return 'classif-public';
  return '';
}
function statusClass(s) {
  if (!s) return '';
  const v = s.toLowerCase();
  if (v.includes('active') || v.includes('live')) return 'status-active';
  if (v.includes('review') || v.includes('draft')) return 'status-review';
  return '';
}

function parseSummaryText(text) {
  if (!text) return [];
  const sections = [];
  let cur = null;
  for (const line of text.split('\n')) {
    // Match **Label [TAG]:**, **Label [TAG]**, or **Label:**
    const m = line.match(/^\*\*([^*\[\]]+?)(?:\s*\[(EXTRACTED|INFERRED)\])?\s*:?\*\*\s*(.*)/i);
    if (m) {
      if (cur) sections.push(cur);
      cur = {
        label:      m[1].replace(/:$/, '').trim(),
        confidence: m[2] ? m[2].toUpperCase() : null,
        content:    m[3].trim()
      };
    } else if (cur && line.trim()) {
      cur.content += (cur.content ? '\n' : '') + line.trim();
    }
  }
  if (cur) sections.push(cur);
  return sections;
}

function VaultPage() {
  const [activeTab,      setActiveTab]     = useState('risk');
  const [docs,           setDocs]          = useState(null);
  const [loading,        setLoading]       = useState(true);
  const [error,          setError]         = useState(null);
  const [selectedDoc,    setSelectedDoc]   = useState(null);
  const [summary,        setSummary]       = useState(null);
  const [summaryLoading, setSummaryLoading]= useState(false);
  const [summarySource,  setSummarySource] = useState('');
  const [search,         setSearch]        = useState('');

  useEffect(() => {
    fetch('/api/vault/documents')
      .then(r => r.json())
      .then(d => { if (d.available) setDocs(d.documents); else setError(d.message); setLoading(false); })
      .catch(() => { setError('Failed to connect to server.'); setLoading(false); });
  }, []);

  const generateSummary = async (doc) => {
    setSelectedDoc(doc); setSummary(null); setSummaryLoading(true);
    try {
      const res = await fetch('/api/vault/summary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ section: doc.section, index: doc.index })
      });
      const data = await res.json();
      setSummary(data.summary || 'No summary generated.');
      setSummarySource(data.source || '');
    } catch { setSummary('Failed to generate summary. Please try again.'); }
    setSummaryLoading(false);
  };

  const closePanel = () => { setSelectedDoc(null); setSummary(null); };

  const totalDocs = docs
    ? Object.values(docs).reduce((s, arr) => s + (arr?.length || 0), 0)
    : 0;

  if (loading) return (
    <div className="page">
      <div className="page-header"><div className="page-title">Risk Sensing & Policy Intelligence</div></div>
      <div className="spinner-wrap"><div className="spinner"></div><span>Loading knowledge vault…</span></div>
    </div>
  );

  return (
    <div className="page" style={{maxWidth:1300}}>
      <div className="page-header">
        <div className="page-title">Risk Sensing & Policy Intelligence</div>
        <div className="page-sub">Internal knowledge base Risk, Regulatory, and Email intelligence documents. Summaries generated on-demand from source documents only.</div>
      </div>

      {error ? (
        <div className="alert alert-info" style={{maxWidth:600}}>
          <i className="fa-solid fa-folder-open alert-icon"></i>
          <div>
            <div style={{fontWeight:600,marginBottom:4}}>Vault data not loaded</div>
            <div>{error}</div>
            <div style={{marginTop:8,fontSize:12,color:'var(--text-3)'}}>
              Place <strong>Vault+Report_Page_Data.docx</strong> in the <code>data/vault/</code> folder, then restart the server.
            </div>
          </div>
        </div>
      ) : (
        <>
          {/* Tabs */}
          <div className="vault-tabs">
            {VAULT_TABS.map(t => {
              const isDocTab = VAULT_DOC_TABS.has(t.key);
              const count = isDocTab ? (docs?.[t.key]?.length || 0) : null;
              return (
                <button key={t.key} className={`vault-tab${activeTab === t.key ? ' active' : ''}`}
                  onClick={() => { setActiveTab(t.key); setSearch(''); }}>
                  <i className={`fa-solid ${t.icon}`}></i>
                  {t.label}
                  {count != null && <span className="vault-tab-count">{count}</span>}
                </button>
              );
            })}
          </div>

          {/* Search — only for document tabs */}
          {VAULT_DOC_TABS.has(activeTab) && (
            <div className="vault-search">
              <input className="input-box" style={{maxWidth:320,fontSize:13,padding:'8px 12px'}}
                placeholder={`Search ${VAULT_TABS.find(t=>t.key===activeTab)?.label}…`}
                value={search} onChange={e => setSearch(e.target.value)} />
              {search && (
                <button onClick={() => setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',fontSize:14}}>
                  <i className="fa-solid fa-xmark"></i>
                </button>
              )}
            </div>
          )}

          {/* Tab content */}
          {activeTab === 'insights' ? (
            <InsightsDataTab />
          ) : activeTab === 'report' ? (
            <ReportGeneratorTab />
          ) : (
            <div className="vault-layout">
              <div>
                {(() => {
                  const tabDocs = (docs?.[activeTab] || []).filter(d =>
                    !search || d.title.toLowerCase().includes(search.toLowerCase()) ||
                    d.preview.toLowerCase().includes(search.toLowerCase())
                  );
                  if (!tabDocs.length) {
                    return (
                      <div className="vault-empty-state">
                        <div className="vault-empty-icon"><i className="fa-solid fa-folder-open"></i></div>
                        <div className="vault-empty-title">{search ? 'No results found' : 'No documents in this section'}</div>

                  return (
                    <div className="vault-grid">
                      {tabDocs.map((doc, i) => (
                        <VaultDocCard key={i} doc={doc}
                          selected={false}
                          onGenerate={generateSummary} />
                      ))}
                    </div>
                  );
                })()}
              </div>
            </div>
          )}

          {/* Summary child window (modal overlay) */}
          {selectedDoc && (
            <VaultSummaryPanel
              doc={selectedDoc} summary={summary}
              loading={summaryLoading} source={summarySource}
              onClose={closePanel} />
          )}
        </>
      )}
    </div>
  );
}

function ReportChart({ chartData, chartType, title, metrics }) {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    if (!canvasRef.current || !chartData) return;
    if (canvasRef.current._chartInst) canvasRef.current._chartInst.destroy();
    const isHBar = chartType === 'horizontalBar';
    const isDoughnut = chartType === 'doughnut';
    const colors = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#84cc16'];
    canvasRef.current._chartInst = new Chart(canvasRef.current, {
      type: isDoughnut ? 'doughnut' : 'bar',
      data: {
        labels: chartData.labels,
        datasets: [{
          label: title,
          data: chartData.values,
          backgroundColor: isDoughnut ? colors.slice(0, chartData.labels.length) : '#3b82f6',
          borderColor: isDoughnut ? '#fff' : '#3b82f6',
          borderWidth: isDoughnut ? 2 : 0,
          borderRadius: isDoughnut ? 0 : 4,
        }]
      },
      plugins: [{
        id: 'snapshotForPrint',
        afterRender: function(chart) {
          try {
            var cv2 = chart.canvas;
            var w2 = cv2.width || 700;
            var h2 = cv2.height || 280;
            var off2 = document.createElement('canvas');
            off2.width = w2; off2.height = h2;
            var c2 = off2.getContext('2d');
            c2.fillStyle = '#ffffff';
            c2.fillRect(0, 0, w2, h2);
            c2.drawImage(cv2, 0, 0);
            cv2._printDataUrl = off2.toDataURL('image/png');
          } catch(snapErr) {}
        }
      }],
      options: {
        indexAxis: isHBar ? 'y' : 'x',
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 400 },
        plugins: {
          legend: { display: isDoughnut, position: 'bottom', labels: { boxWidth: 12, font: { size: 11 }, color: '#1E293B' } },
          tooltip: { callbacks: { label: ctx => { const v = ctx.parsed[isHBar ? 'x' : 'y']; return (title.includes('Volume') || title.includes('Exposure')) ? ` £${Number(v).toLocaleString()}` : ` ${Number(v).toLocaleString()}`; } } }
        },
        scales: isDoughnut ? {} : {
          x: { grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { font: { size: 10.5 }, color: '#334155'} },
          y: { grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { font: { size: 10.5 }, color: '#334155'} }
        }
      }
    });
    return () => { if (canvasRef.current?._chartInst) canvasRef.current._chartInst.destroy(); };
  }, []);
  return (
    <div className="report-chart-card">
      <div className="report-chart-title">{title}</div>
      {metrics && (
        <div className="report-chart-kpis">
          {Object.entries(metrics).map(([k,v]) => (
            <div key={k} className="report-chart-kpi"><strong>{k}:</strong> {v}</div>
          ))}
        </div>
      )}
      <div style={{position:'relative', height: chartType === 'doughnut' ? 200 : 210}}>
        <canvas ref={canvasRef}></canvas>
      </div>
    </div>
  );
}

function EmailPreviewWindow({ emailText, onClose }) {
  if (!emailText) return null;

  const handleBackdrop = e => { if (e.target === e.currentTarget) onClose(); };
  const copyEmail = () => navigator.clipboard.writeText(emailText).then(() => alert('Copied to clipboard!'));

    const t = line.replace(/\*\*/g, '');
    if (/^\*\*.*\*\*$/.test(line)) return <div key={i} className="email-body-line-heading">{t}</div>;
    if (line.trim().startsWith('•')) return <div key={i} className="email-body-line-bullet">{line}</div>;
    if (!line.trim()) return <div key={i} style={{height:7}}></div>;
    return <div key={i} className="email-body-line-text">{line}</div>;

    <div className="vault-summary-overlay" onClick={handleBackdrop}>

          <div style={{fontSize:10.5,fontWeight:700,textTransform:'uppercase',letterSpacing:0.5,color:'var(--text-3)',marginBottom:3}}>Subject</div>
          <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{subject}</div>
        </div>
        <div className="vault-summary-body">
          {emailText.split('\n').map((line, i) => formatLine(line, i))}
        </div>
        <div className="vault-summary-footer">
          <span className="vault-summary-footer-left"><i className="fa-solid fa-robot"></i>Generated by Groq AI · llama-3.1-8b-instant</span>
