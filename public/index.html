const SECTION_ICONS = { A: 'fa-bullseye', B: 'fa-magnifying-glass-chart', C: 'fa-shield-halved', D: 'fa-gears', E: 'fa-chart-line', F: 'fa-database' };
const SECTION_COLORS = { A: 'section-blue', B: 'section-blue', C: 'section-orange', D: 'section-purple', E: 'section-teal', F: 'section-gray' };

function SummaryView({ text }) {
  if (!text) return null;
  const sectionRegex = /^([A-F])\.\s*([^:\n]+):\s*(.+)$/gm;
  const sections = [];
  let match;
  while ((match = sectionRegex.exec(text)) !== null) {
    sections.push({ key: match[1], label: match[2].trim(), content: match[3].trim() });
  }
  if (sections.length >= 3) {
    return (
      <div className="summary-sections">
        {sections.map(s => (
          <div key={s.key} className={`summary-section ${SECTION_COLORS[s.key] || ''}`}>
            <div className="summary-section-label">
              <i className={`fa-solid ${SECTION_ICONS[s.key] || 'fa-circle'}`}></i>
              <span>{s.key}. {s.label}</span>
            </div>
            <div className="summary-section-content">{s.content}</div>
          </div>
        ))}
      </div>
    );
  }
  return <div className="summary-text">{text}</div>;
}

function InsightsPage() {
  const [question,    setQuestion]    = useState('');
  const [loading,     setLoading]     = useState(false);
  const [result,      setResult]      = useState(null);
  const [error,       setError]       = useState(null);
  const [catalogue,   setCatalogue]   = useState([]);
  const [showPreview, setShowPreview] = useState(false);

  useEffect(() => {
    fetch('/api/catalogue')
      .then(r => r.json())
      .then(d => setCatalogue(d.datasets || []))
      .catch(() => {});
  }, []);

  const ask = useCallback(async (q) => {
    const text = (q || question).trim();
    if (!text) return;
    setLoading(true); setResult(null); setError(null); setShowPreview(false);
    try {
      const [res] = await Promise.all([
        fetch('/api/insights', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ question: text }) }),
        minDelay(8000, 15000)
      ]);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Server error');
      setResult(data);
    } catch (err) {
      setError(err.message || 'Failed to connect to server.');
    } finally {
      setLoading(false);
    }
  }, [question]);

  const handleSuggested = (text) => { setQuestion(text); ask(text); };

  const handleKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } };

  return (
    <div className="page">
      {/* Header */}
      <div className="page-header">
        <div className="page-title">Intelligence Center</div>
        <div className="page-sub">
          Ask questions across approved Risk &amp; Compliance datasets.
          
        </div>
      </div>


      {/* Suggested questions */}
      <div className="questions-grid">
        {SUGGESTED.map((s, i) => (
          <button key={i} className="q-card" onClick={() => handleSuggested(s.text)}>
            <div className="q-card-icon"><i className={`fa-solid ${s.icon}`}></i></div>
            <div>
              <div className="q-card-text">{s.text}</div>
              <div className="q-card-badge">{s.tag}</div>
            </div>
          </button>
        ))}
      </div>

      {/* Input */}
      <div className="input-row">
        <input
          className="input-box"
          type="text"
          placeholder="Ask a question about your risk data…"
          value={question}
          onChange={e => setQuestion(e.target.value)}
          onKeyDown={handleKey}
        />
        <button className="btn-primary" onClick={() => ask()} disabled={loading || !question.trim()}>
          {loading
            ? <><div className="spinner" style={{width:16,height:16,borderWidth:2}}></div> Analysing…</>
            : <><i className="fa-solid fa-paper-plane"></i> Ask</>}
        </button>
      </div>

      {/* Loading */}
      {loading && (
        <ProcessingView
          title="Analysing Intelligence Data"
          icon="fa-chart-bar"
          messages={[
            'Scanning dataset dimensions…',
            'Executing semantic query layer…',
            'Resolving risk data entities…',
            'Aggregating cross-dataset signals…',
            'Applying analytical filters…',
            'Constructing insight response…',
            'Validating output against schema…',
          ]}
        />
      )}

      {/* Error */}
      {error && (
        <div className="alert alert-error">
          <i className="fa-solid fa-circle-exclamation alert-icon"></i>
          {error}
        </div>
      )}

      {/* Not found */}
      {result && !result.answer_available && (
        <div className="alert alert-info">
          <i className="fa-solid fa-triangle-exclamation alert-icon"></i>
          {result.message}
        </div>
      )}

      {/* Results */}
      {result && result.answer_available && (
        <div>
          {/* Concentration / Trend Alert Banner */}
          {result.concentration_insight && (
            <div className="concentration-banner">
              <i className="fa-solid fa-triangle-exclamation"></i>
              {result.concentration_insight}
            </div>
          )}

          {/* Structured Intelligence Brief */}
          <div className="summary-card">
            <div className="summary-header">
              <i className="fa-solid fa-brain summary-icon"></i>
              <span className="summary-label">Intelligence Brief</span>
            </div>
            <SummaryView text={result.summary} />
          </div>

          {/* Metrics */}
          <MetricsRow metrics={result.key_metrics} />

          {/* Chart */}
          <div className="card chart-card">
            <div className="card-header">
              <span className="card-title">{result.title}</span>
              <span className="ds-chip">
                <i className="fa-solid fa-table"></i>
                {result.dataset_used.replace(/_/g, ' ')}
              </span>
            </div>
            <ChartComponent
              type={result.chart_type}
              data={result.chart_data}
              title=""
              highlightIndex={result.highlight_index}
              highlightType={result.highlight_type}
            />
          </div>

          {/* Data Quality Note */}
          {result.quality_note && (
            <div className="quality-note">
              <i className="fa-solid fa-circle-info"></i>
              {result.quality_note}
            </div>
          )}

          {/* Source + preview */}
          <div className="info-row">
            <span><i className="fa-solid fa-database"></i> Dataset: <strong>{result.dataset_used.replace(/_/g, ' ')}</strong></span>
            <span><i className="fa-solid fa-lock"></i> Source: Approved Excel datasets only — no external data used</span>
          </div>

          {/* Preview toggle */}
          <button className="preview-toggle" onClick={() => setShowPreview(p => !p)}>
            <i className={`fa-solid fa-chevron-${showPreview ? 'up' : 'down'}`}></i>
            {showPreview ? 'Hide' : 'Show'} data preview (first 10 rows)
          </button>
          {showPreview && <DataTable columns={result.columns} preview={result.preview} />}

          {/* Follow-up suggestions */}
          {FOLLOWUPS[result.dataset_used] && (
            <div className="followup-section">
              <div className="followup-label">Suggested follow-up questions</div>
              <div className="followup-list">
                {FOLLOWUPS[result.dataset_used].map((q, i) => (
                  <button key={i} className="followup-btn" onClick={() => handleSuggested(q)}>{q}</button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Scenario Chart helper ─────────────────────────────────────────────────────
function buildScenarioChartCfg(chartInfo, opts = {}) {
  if (!chartInfo || !chartInfo.available || !chartInfo.chart_data) return null;
  const { type, chart_data, multi } = chartInfo;
  const { xLabel, yLabel, enableZoom } = opts;

  const PALETTE = ['#FFAD28','#1E3A5F','#059669','#FFAD28','#7C3AED','#DB2777','#0284C7'];

  const axisTitle = (label) => label ? { display:true, text:label, color:'#64748B', font:{family:'Inter',size:11,weight:'500'} } : {};

  const zoomCfg = enableZoom ? {
    zoom: { zoom:{ wheel:{enabled:true}, pinch:{enabled:true}, mode:'xy' }, pan:{enabled:true,mode:'xy'} }
  } : {};

  const baseOpts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{ position:'bottom', labels:{ font:{family:'Inter',size:11}, padding:12, boxWidth:12, color:'#1E293B' } },
      title:{ display:false },
      tooltip:{ callbacks:{ label: ctx => ` ${ctx.dataset.label || ''}: ${ctx.formattedValue}` } },
      zoom: enableZoom ? zoomCfg.zoom : undefined
    }
  };

  const scaleFont = { family:'Inter', size:11 };

  if (multi) {
    const datasets = chart_data.datasets.map((ds, i) => ({
      label: ds.label,
      data:  ds.values,
      backgroundColor: PALETTE[i % PALETTE.length] + 'CC',
      borderColor:     PALETTE[i % PALETTE.length],
      borderWidth: 1,
      borderRadius: 3
    }));
    return {
      type: 'bar',
      data: { labels: chart_data.labels, datasets },
      options: {
        ...baseOpts,
        indexAxis: type === 'horizontalBar' ? 'y' : 'x',
        scales:{
          x:{ stacked:false, grid:{color:'rgba(0,0,0,0.08)'}, ticks:{font:scaleFont, color:'#334155'}, title:{ display:!!xLabel, text:xLabel||'', color:'#334155', font:{...scaleFont,weight:'500'} } },
          y:{ stacked:false, grid:{color:'rgba(0,0,0,0.08)'}, ticks:{font:scaleFont, color:'#334155'}, beginAtZero:true, title:{ display:!!yLabel, text:yLabel||'', color:'#334155', font:{...scaleFont,weight:'500'} } }
        }
      }
    };
  }

  return {
    type: type === 'horizontalBar' ? 'bar' : (type === 'line' ? 'line' : 'bar'),
    data:{
      labels: chart_data.labels,
      datasets:[{
        label: chartInfo.title || '',
        data: chart_data.values,
        backgroundColor: type === 'line' ? 'rgba(255,173,40,0.1)' : PALETTE.map((c,i) => i===0?'#FFAD28':c+'99'),
        borderColor: '#FFAD28',
        borderWidth: type === 'line' ? 2.5 : 0,
        fill: type === 'line',
        tension: type === 'line' ? 0.4 : 0,
        pointBackgroundColor: '#FFAD28',
        pointRadius: type === 'line' ? 4 : 0,
        borderRadius: type === 'line' ? 0 : 4
      }]
    },
    options:{
      ...baseOpts,
      indexAxis: type === 'horizontalBar' ? 'y' : 'x',
      plugins:{...baseOpts.plugins, legend:{display:false}},
      scales:{
        x:{ grid:{color:'rgba(0,0,0,0.08)'}, ticks:{font:scaleFont, color:'#334155'}, title:{ display:!!xLabel, text:xLabel||'', color:'#334155', font:{...scaleFont,weight:'500'} } },
        y:{ grid:{color:'rgba(0,0,0,0.08)'}, ticks:{font:scaleFont, color:'#334155'}, beginAtZero:true, title:{ display:!!yLabel, text:yLabel||'', color:'#334155', font:{...scaleFont,weight:'500'} } }
      }
    }
  };
}

function ScenarioChart({ chartInfo, opts }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const cfg = buildScenarioChartCfg(chartInfo, opts || {});
    if (!cfg) return;
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), cfg);
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(chartInfo), JSON.stringify(opts)]);

  if (!chartInfo || !chartInfo.available) {
    return <div className="scenario-chart-unavail"><i className="fa-solid fa-circle-info" style={{marginRight:6}}></i>Chart data not available in uploaded Excel file.</div>;
  }
  return <div style={{position:'relative',height:'100%'}}><canvas ref={canvasRef}></canvas></div>;
}

// ── Chart Expand Modal ────────────────────────────────────────────────────────
function ChartExpandModal({ sheetKey, chartInfo, onClose }) {
  const meta = CHART_META[sheetKey] || {};
  const chartRef = useRef(null);
  const title = chartInfo?.title || sheetKey.replace(/_/g,' ');

  const handleZoom = (dir) => {
    if (!chartRef.current) return;
    const chart = chartRef.current;
    if (dir === 'in')    chart.zoom(1.2);
    else if (dir === 'out') chart.zoom(0.8);
    else chart.resetZoom();
  };

  const handleExport = () => {
    if (!chartRef.current) return;
    const url = chartRef.current.toBase64Image();
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title.replace(/\s+/g,'_')}.png`;
    a.click();
  };

  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  return (
    <div className="chart-modal-overlay" onClick={onClose}>
      <div className="chart-modal" onClick={e => e.stopPropagation()}>
        <div className="chart-modal-hdr">
          <div className="chart-modal-hdr-text">
            <div className="chart-modal-title">{title}</div>
            {meta.description && <div className="chart-modal-desc">{meta.description}</div>}
          </div>
          <div className="chart-modal-controls">
            <button className="chart-zoom-btn" onClick={() => handleZoom('in')} title="Zoom in"><i className="fa-solid fa-magnifying-glass-plus"></i></button>
            <button className="chart-zoom-btn" onClick={() => handleZoom('out')} title="Zoom out"><i className="fa-solid fa-magnifying-glass-minus"></i></button>
            <button className="chart-zoom-btn" onClick={() => handleZoom('reset')} title="Reset zoom" style={{fontSize:11}}>Reset</button>
            <button className="chart-zoom-btn" onClick={handleExport} title="Export as PNG"><i className="fa-solid fa-download"></i></button>
            <button className="chart-icon-btn" onClick={onClose} title="Close" style={{marginLeft:4,fontSize:16}}><i className="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div className="chart-modal-body" style={{height:1100}}>
          <ChartModalCanvas chartInfo={chartInfo} meta={meta} chartRef={chartRef} />
        </div>
      </div>
    </div>
  );
}

function ChartModalCanvas({ chartInfo, meta, chartRef }) {
  const canvasRef = useRef(null);
  const instanceRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (instanceRef.current) { instanceRef.current.destroy(); instanceRef.current = null; }
    const cfg = buildScenarioChartCfg(chartInfo, { xLabel: meta.xLabel, yLabel: meta.yLabel, enableZoom: true });
    if (!cfg) return;
    instanceRef.current = new Chart(canvasRef.current.getContext('2d'), cfg);
    chartRef.current = instanceRef.current;
    return () => { if (instanceRef.current) { instanceRef.current.destroy(); instanceRef.current = null; } };
  }, [JSON.stringify(chartInfo)]);
  return <div style={{position:'relative',height:'100%'}}><canvas ref={canvasRef}></canvas></div>;
}

function HeatmapTable({ chartInfo }) {
  if (!chartInfo || !chartInfo.available || !chartInfo.rows || !chartInfo.rows.length) {
    return <div className="scenario-chart-unavail"><i className="fa-solid fa-circle-info" style={{marginRight:6}}></i>Chart data not available in uploaded Excel file.</div>;
  }
  const { rows, columns } = chartInfo;
  const labelCol  = columns[0];
  const dayCols   = columns.slice(1);

  const sevClass = (val) => {
    if (val === null || val === undefined || val === '') return '';
    const s = String(val).toLowerCase();
    if (s === 'critical' || s === '4' || (typeof val === 'number' && val >= 4)) return 'hm-critical';
    if (s === 'breach' || s === 'high' || s === '3' || (typeof val === 'number' && val >= 3)) return 'hm-high';
    if (s === 'elevated' || s === 'medium' || s === '2' || (typeof val === 'number' && val >= 2)) return 'hm-elevated';
    return 'hm-normal';
  };

  return (
    <div className="heatmap-wrap">
      <table className="heatmap-table">
        <thead>
          <tr>
            <th>{labelCol}</th>
            {dayCols.map(c => <th key={c}>{c}</th>)}
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => (
            <tr key={i}>
              <td>{String(row[labelCol] ?? '')}</td>
              {dayCols.map(c => <td key={c} className={sevClass(row[c])}>{row[c] !== null && row[c] !== undefined ? String(row[c]) : '—'}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

  "article": "Sanctions Targeting Russia’s Energy Sector\nNew transaction ban on refineries. The new Article 5ae(2a) of Regulation 833 bans any transaction, direct or indirect, with refineries listed in new Annex XLVII, Part D. Part D covers refineries in Russia and in third countries that process or refine Russian crude oil, process or blend petroleum products listed in Annex XXV or Russian-origin mineral products, or are used to circumvent EU restrictive measures. The recitals of the 21st package confirm that the ban targets Russia’s oil-sale revenues and reaches both access to the listed refineries’ facilities and the provision of any services to them.5\nThe Council has so far listed one refinery under this new ban: the Kulevi Oil Refinery in Georgia. Reflecting the sensitivity of listing an operator outside Russia, the prohibition applies to this listing only from 25 January 2027, and the European Commission (Commission) must report to the Council by 25 October 2026 on whether the listing should be maintained. Companies with dealings involving the Kulevi refinery have a window to wind down affected activity but should not assume the delayed application date is permanent — the Commission’s review could result in the listing being kept in place.\nOil price cap — suspension of the adjustment mechanism. The newly introduced Article 3n(11a) of Regulation 833 suspends, from 24 July 2026 to 14 July 2027, the procedure for amending the oil price cap on Russian crude oil — including the calculation of the average market price of Russian crude oil over a 22-week period, publication of the related notice and amendment of Annex XXVIII. New Article 7a(2) of Regulation 833 mirrors this, suspending the Commission’s corresponding obligation under Article 7a(1)(a) of Regulation 833 over the same period. The Council grounds the suspension in the recent exceptional disturbances in the crude oil and petroleum-product markets — in particular due to the situation caused by the closure of the Strait of Hormuz — making it necessary to keep the cap effective.6 The suspension is subject to an interim review. The Commission must still calculate a new average market price by 15 January 2027 and report it to the Council, but any decision to amend the cap based on that calculation is discretionary; if the Council does not act, the current cap remains in place. The ordinary adjustment procedure resumes automatically from 15 July 2027. In addition, the 21st package extends the existing exemption allowing for the transport (including related ancillary services) of crude oil falling under CN code 2709 00 originating in the Sakhalin-2 Project to Japan until 31 March 2028.\nSeized oil cargoes and remote EU territories. Two narrow derogations address previous practical issues in the oil regime. First, to let member states dispose safely of seized Russian oil, competent authorities may authorize the purchase, import or transfer of crude oil, or of Annex XXV petroleum products that a member state authority has seized or confiscated in national proceedings, together with the related technical, brokering or financing services (new Article 3m(11) of Regulation 833), and their temporary storage or free-zone placement in EU territory pending sale (new Article 3nb(5) of Regulation 833). Throughout, the goods must remain under the authorities’ effective control, and the operations must not, directly or indirectly, benefit any Russian person or entity. Second, competent authorities may waive the requirement to prove the origin of the crude oil used in petroleum products refined in a third country and supplied to an EU outermost region or associated overseas country or territory — but only where a proven supply-disruption risk exists and no alternative source is viable (Article 3ma of Regulation 833).\nLNG tanker vessel sale restrictions — a phased mechanism. The new Article 3qa of Regulation 833 introduces a notification-first, prohibition-later regime for sales of LNG tanker vessels. From 24 July 2026, any sale or transfer of ownership of LNG tanker vessels7 by an EU national, resident or entity to a third country must be notified immediately to the competent authorities, including the identities of seller and purchaser, the vessel’s registration number by the International Maritime Organization (IMO number) and its call sign. The substantive prohibition on sales to Russia or for use in Russia — together with due diligence duties and mandatory no-resale clauses for sales to other third countries — does not yet apply; those obligations take effect only once triggered by a future Council Regulation, following a Council review due by 25 October 2026. In practice, only the notification duty currently binds EU sellers, though where necessary they should build contractual flexibility into pending transactions given the potential prohibition.\nLNG terminal services ban. Article 3rb of Regulation 833 is replaced while its prohibition is in essence retained but slightly broadened: From 1 January 2027, it is prohibited to provide, directly or indirectly, LNG terminal services to any natural or legal person, entity or body in Russia, and to maintain contracts concerning prohibited LNG services beyond that date. The replacement broadens the second limb — services to entities more than 50% owned or controlled by a Russian citizen or Russian entity — in two respects: It deletes the requirement that the entity must be established in the EU, and it widens the control test to “controlled directly or indirectly.” Providers of LNG terminal services should therefore screen counterparties for majority Russian ownership or direct or indirect Russian control irrespective of their place of establishment, ahead of 1 January 2027.\nLNG-related exemptions and a new reporting duty. Alongside the Sakhalin-2 crude oil exemption for transport to Japan (until 31 March 2028; see above), the 21st package creates a parallel exemption — running from 24 July 2026 to the same date — for Sakhalin-2 LNG transported to Japan and the Republic of Korea (Article 3ra(5) of Regulation 833; Annex XXIX, Part B)."

function naFinViz(detail) {

  const pairRe = new RegExp('([A-Za-z][A-Za-z0-9 /&()+-]{1,38}?):\\s*' + valTok, 'gi');

    if (raw && /\d/.test(raw)) pairs.push({ label, raw, num: isNaN(num) ? 0 : Math.abs(num), unit });
  }
  const figRe = /(~?≈?[−-]?\$\s?\d[\d.,]*(?:\s?[–-]\s?\$?\d[\d.,]*)?\s?(?:bn|billion|b|m|million|k)?|\d[\d.,]*\s?%|[−-]?\d[\d.,]*\s?bps|\d+\s?(?:hours?|hrs?|days?))/gi;
  const seen = new Set(); const figures = [];
  while ((m = figRe.exec(str)) !== null) { if (m[0] === '') { figRe.lastIndex++; continue; } const r = m[0].trim(); const k = r.toLowerCase(); if (!seen.has(k)) { seen.add(k); figures.push(r); } }

// Financial mini-charts (SVG) — gauge, bars, trend
function FinGauge({ value, target, unit, valueRaw, max }) {
  const cx = 130, cy = 108, r = 80, thick = 16;
  const pt = (deg) => { const rad = Math.PI * (180 - deg) / 180; return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)]; };
  const arc = (a, b) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const f = Math.max(0, Math.min(1, value / max));
  const tf = target != null ? Math.max(0, Math.min(1, target / max)) : null;
  const tp = tf != null ? pt(180 * tf) : null;
  return (
    <svg viewBox="0 0 260 132" width="100%" style={{ display: 'block' }}>
      <path d={arc(0, 180)} fill="none" stroke="rgba(0,0,0,0.08)" strokeWidth={thick} strokeLinecap="round" />
      <path d={arc(0, Math.max(1, 180 * f))} fill="none" stroke="var(--primary)" strokeWidth={thick} strokeLinecap="round" />
      {tp && <circle cx={tp[0]} cy={tp[1]} r={5} fill="#0F172A" />}
      <text x={cx} y={cy - 6} textAnchor="middle" fontSize={27} fontWeight="800" fill="var(--text)">{valueRaw}</text>
      {target != null && <text x={cx} y={cy + 16} textAnchor="middle" fontSize={11} fontWeight="700" fill="var(--text-3)">Target {target}{/%|bps/.test(unit) ? unit : ''}</text>}
    </svg>
  );
}

      return { name, vals };
    });
    const nA = sv[0].vals.length, lastA = sv[0].vals[nA - 1];
    built = sv.map((s, si) => si === 0
      ? { name: s.name, pts: s.vals.map((v, i) => [i, v]) }
      : { name: s.name, pts: (nA ? [[nA - 1, lastA]] : []).concat(s.vals.map((v, i) => [nA + i, v])) });
    xMax = Math.max(1, ...built.map(b => b.pts.length ? b.pts[b.pts.length - 1][0] : 0));
  } else {
    built = names.map((name, si) => ({ name, pts: c.rows.map((r, i) => { const v = frNum(r[si + 1]); return v == null ? null : [i, v]; }).filter(Boolean) }));
    xMax = Math.max(1, c.rows.length - 1);
  }
  const allV = built.flatMap(b => b.pts.map(p => p[1]));
  const mx = Math.max(...allV, 0.0001), mn = Math.min(...allV, mx, 0);
  const ratio = mx <= 1.5;
  const fmt = (v) => ratio ? (v * 100).toFixed(1) + '%' : (Math.abs(v) >= 1000 ? '$' + (v / 1000).toFixed(1) + 'B' : '$' + (Math.round(v * 10) / 10) + 'M');
  const X = (xi) => padL + (xi / xMax) * cw, Y = (v) => padT + ch - ((v - mn) / (mx - mn || 1)) * ch;
  const cols = [FR_C.neutral, FR_C.green, FR_C.red, FR_C.primary], dash = [null, '5 4', '5 4', '2 3'];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }}>
        {[0, 0.5, 1].map((f, i) => { const y = padT + ch - f * ch; const v = mn + f * (mx - mn); return <g key={i}><line x1={padL} y1={y} x2={W - padR} y2={y} stroke="rgba(0,0,0,0.07)" /><text x={padL - 5} y={y + 3} textAnchor="end" fontSize={8} fill="var(--text-3)">{fmt(v)}</text></g>; })}
        {!hasArrows && c.rows.map((r, i) => <text key={i} x={X(i)} y={H - padB + 13} textAnchor="middle" fontSize={8} fill="var(--text-3)">{String(r[0]).replace(/\s*\(.*\)/, '')}</text>)}
        {built.map((s, si) => {
          if (s.pts.length < 1) return null;
          const d = s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
          const last = s.pts[s.pts.length - 1], lx = X(last[0]), ly = Y(last[1]), near = lx > W - padR - 28;
          return <g key={si}>
            {s.pts.length > 1 && <path d={d} fill="none" stroke={cols[si % cols.length]} strokeWidth={2.2} strokeDasharray={dash[si % dash.length] || 'none'} strokeLinecap="round" strokeLinejoin="round" />}
            <circle cx={lx} cy={ly} r={3} fill={cols[si % cols.length]} />
            <text x={near ? lx - 5 : lx + 5} y={ly - 4} textAnchor={near ? 'end' : 'start'} fontSize={8.5} fontWeight="800" fill={cols[si % cols.length]}>{fmt(last[1])}</text>
          </g>;
        })}
      </svg>
      <div className="na-fin-legend">{built.map((s, i) => <span key={i} className="na-fin-leg-item"><span className="na-fin-leg-dot" style={{ background: cols[i % cols.length] }}></span><span className="na-fin-leg-k">{s.name.replace(/\s*\(.*\)/, '')}</span></span>)}</div>
    </div>
  );
}

// Chart 2 — donut with one emphasised segment
function FinRevDonut({ c }) {
  const segs = c.rows.filter(r => !/^total/i.test(r[0]) && r[0]).map(r => ({ label: r[0], value: r[1], share: frNum(r[2]) || 0, hi: /high|emphas|red/i.test((r[3] || '') + ' ' + (r[2] || '')) }));
  const sum = segs.reduce((a, s) => a + s.share, 0) || 1;
  segs.forEach(s => s.share = s.share / sum);                 // normalise shares to 1
  const totalRow = c.rows.find(r => /^total/i.test(r[0]));
  const sumM = segs.reduce((a, s) => { const v = frNum(s.value) || 0; return a + v * (/b/i.test(String(s.value)) ? 1000 : 1); }, 0);
  const totalVal = totalRow ? totalRow[1] : (sumM >= 1000 ? '$' + (sumM / 1000).toFixed(1) + 'B' : '$' + Math.round(sumM) + 'M');
  const cx = 76, cy = 90, r = 60, ir = 37;
  let ang = -Math.PI / 2, gi = 0;
  const grays = ['#CBD5E1', '#94A3B8', '#64748B', '#B0BAC9', '#A3ADBD'];
  const arc = (a0, a1) => {
    const p = (rr, a) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    const [x0, y0] = p(r, a0), [x1, y1] = p(r, a1), [x2, y2] = p(ir, a1), [x3, y3] = p(ir, a0);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${ir} ${ir} 0 ${large} 0 ${x3} ${y3} Z`;
  };
  const short = (s) => { s = String(s || ''); return s.length > 15 ? s.slice(0, 14) + '…' : s; };
  return (
    <div>
      <svg viewBox="0 0 360 184" width="100%" style={{ display: 'block' }}>
        {segs.map((s, i) => { const a0 = ang, a1 = ang + s.share * Math.PI * 2; ang = a1; const fill = s.hi ? 'var(--primary)' : grays[gi++ % grays.length]; return <path key={i} d={arc(a0, a1)} fill={fill} />; })}
        {totalVal && <text x={cx} y={cy - 2} textAnchor="middle" fontSize={17} fontWeight="800" fill="var(--text)">{totalVal}</text>}
        <text x={cx} y={cy + 13} textAnchor="middle" fontSize={9} fontWeight="600" fill="var(--text-3)">Total</text>
        {segs.map((s, i) => <g key={i} transform={`translate(154 ${30 + i * 26})`}>
          <rect x={0} y={-9} width={11} height={11} rx={2} fill={s.hi ? 'var(--primary)' : grays[i % grays.length]} />
          <text x={16} y={0} fontSize={10.5} fontWeight={s.hi ? 800 : 600} fill={s.hi ? 'var(--text)' : 'var(--text-2)'}>{short(s.label)} · {s.value} · {Math.round(s.share * 100)}%</text>
        </g>)}
      </svg>
    </div>
  );
}

// Chart 3 — grouped bars, last quarter projected (reduced opacity)
function FinRevGroupedBar({ c }) {
  const W = 320, H = 190, padL = 30, padR = 14, padT = 22, padB = 42;
  const xs = c.rows.map(r => r[0]);
  const names = c.headers.slice(1);
  const data = c.rows.map(r => names.map((_, si) => frNum(r[si + 1]) || 0));
  const proj = c.rows.map(r => /project/i.test(r[0]));
  const mx = Math.max(...data.flat(), 1);
  const cw = W - padL - padR, ch = H - padT - padB, n = xs.length;
  const gw = cw / n, bw = Math.min(16, (gw - 8) / names.length);
  const cols = [FR_C.primary, FR_C.red];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }}>
        <line x1={padL} y1={padT + ch} x2={W - padR} y2={padT + ch} stroke="rgba(0,0,0,0.12)" />
        {c.rows.map((r, i) => {
          const gx = padL + i * gw + (gw - bw * names.length - 4 * (names.length - 1)) / 2;
          return <g key={i} opacity={proj[i] ? 0.45 : 1}>
            {names.map((_, si) => { const v = data[i][si]; const bh = Math.max(2, (v / mx) * ch); const x = gx + si * (bw + 4); const y = padT + ch - bh; return <g key={si}><rect x={x} y={y} width={bw} height={bh} rx={3} fill={cols[si]} /><text x={x + bw / 2} y={y - 4} textAnchor="middle" fontSize={8.5} fontWeight="800" fill={cols[si]}>{v}</text></g>; })}
            <text x={padL + i * gw + gw / 2} y={H - padB + 13} textAnchor="middle" fontSize={8} fill="var(--text-3)">{r[0].replace(/\s*\(.*\)/, '')}</text>
          </g>;
        })}
      </svg>
      <div className="na-fin-legend">{names.map((nm, i) => <span key={i} className="na-fin-leg-item"><span className="na-fin-leg-dot" style={{ background: cols[i] }}></span><span className="na-fin-leg-k">{nm}</span></span>)}</div>
    </div>
  );
}

// Chart 4 — bubble/risk heat map (x likelihood, y impact $M, size exposure $B)
function FinRevBubble({ c }) {
  const W = 340, H = 240, padL = 44, padR = 16, padT = 16, padB = 40;
  const hh = c.headers.map(h => String(h || '').toLowerCase());
  const li = (() => { const k = hh.findIndex(h => /likeli/.test(h)); return k >= 0 ? k : 1; })();
  const yi = (() => { const k = hh.findIndex(h => /impact/.test(h)); return k >= 0 ? k : 2; })();
  const si = hh.findIndex(h => /exposure|bubble|size/.test(h));
  const hasSize = si >= 0;
  const pts = c.rows.map(r => ({ label: r[0], x: frNum(r[li]) || 0, y: frNum(r[yi]) || 0, yRaw: r[yi], size: hasSize ? (frNum(r[si]) || 0) : 0, sizeRaw: hasSize ? r[si] : '' }));
  const ymax = Math.max(...pts.map(p => p.y), 1) * 1.15;
  const smax = Math.max(...pts.map(p => p.size), 1);
  const cw = W - padL - padR, ch = H - padT - padB;
  const X = (v) => padL + v * cw, Y = (v) => padT + ch - (v / ymax) * ch;
  const R = (v) => hasSize ? 7 + Math.sqrt(v / smax) * 15 : 13;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }}>
        {[0, 0.25, 0.5, 0.75, 1].map((f, i) => <g key={i}><line x1={X(f)} y1={padT} x2={X(f)} y2={padT + ch} stroke="rgba(0,0,0,0.05)" /><text x={X(f)} y={H - padB + 14} textAnchor="middle" fontSize={8.5} fill="var(--text-3)">{Math.round(f * 100)}%</text></g>)}
        {[0, 0.5, 1].map((f, i) => { const y = padT + ch - f * ch; return <g key={i}><line x1={padL} y1={y} x2={W - padR} y2={y} stroke="rgba(0,0,0,0.05)" /><text x={padL - 6} y={y + 3} textAnchor="end" fontSize={8.5} fill="var(--text-3)">${Math.round(f * ymax)}M</text></g>; })}
        {pts.map((p, i) => {
          const score = 0.5 * Math.min(1, p.x) + 0.5 * (p.y / ymax);   // priority = likelihood × impact
          const col = frHeat(score);                                   // green → amber → red for higher priority
          return <g key={i}>
            <circle cx={X(p.x)} cy={Y(p.y)} r={R(p.size)} fill={col} fillOpacity={0.85} stroke={col} strokeWidth={1.6} />
            <text x={X(p.x)} y={Y(p.y) + 3} textAnchor="middle" fontSize={8.5} fontWeight="800" fill="#fff">{p.yRaw || ('$' + p.y + 'M')}</text>
          </g>;
        })}
        <text x={padL + cw / 2} y={H - 6} textAnchor="middle" fontSize={9} fontWeight="700" fill="var(--text-3)">Likelihood →</text>
      </svg>
      <div className="na-fin-legend">{pts.map((p, i) => <span key={i} className="na-fin-leg-item"><span className="na-fin-leg-k">{p.label}</span>{hasSize && p.sizeRaw ? <span className="na-fin-leg-v">{p.sizeRaw}</span> : null}</span>)}</div>
    </div>
  );
}

// Chart 5 — VaR loss histogram with percentile reference lines
function FinRevHistogram({ c }) {
  const W = 330, H = 172, padL = 26, padR = 8, padT = 18, padB = 26;
  // Keep only real loss bands (a $ range with a probability in 0–1); drop stray
  // percentile rows like "P50 | $28M · P90" that some sheets append inline.
  const bands = c.rows.map(r => ({ band: r[0], p: frNum(r[1]) })).filter(b => b.band && /\$|\d/.test(b.band) && !/^p\d/i.test(b.band) && b.p != null && b.p > 0 && b.p <= 1);
  const refs = (c.refRows || []).map(r => ({ tag: (String(r[0]).match(/^P\d+/i) || [r[0]])[0], full: r[0], raw: r[1], valM: (frNum(r[1]) || 0) * (/b/i.test(r[1]) ? 1000 : 1) }));
  const pMax = Math.ceil(Math.max(0.2, ...bands.map(b => b.p)) / 0.05) * 0.05;
  const cw = W - padL - padR, ch = H - padT - padB, n = bands.length, bw = cw / n;
  const uppers = bands.map(b => { const nums = (b.band.match(/\d+/g) || []).map(Number); return nums.length ? Math.max(...nums) : 0; });
  const bounds = uppers.slice(0, -1);                       // grid boundaries between bars
  const xForVal = (v) => { let k = -1; for (let i = 0; i < bounds.length; i++) if (bounds[i] <= v) k = i; return padL + (k + 1) * bw; };
  // X-axis labels as loss-band ranges (<$0.5B, $0.5–1B, … $3B+) in a consistent unit.
  const maxU = Math.max(...uppers, 0), useB = maxU >= 1000, dv = useB ? 1000 : 1, U = useB ? 'B' : 'M';
  const nn = (m) => Math.round((m / dv) * 10) / 10;
  const shortBand = (i) => {
    const low = i === 0 ? 0 : uppers[i - 1], high = uppers[i];
    if (i === n - 1) return '$' + nn(low) + U + '+';
    if (low === 0) return '<$' + nn(high) + U;
    return '$' + nn(low) + '–' + nn(high) + U;
  };
  const gy = []; for (let g = 0; g <= pMax + 0.001; g += 0.05) gy.push(Math.round(g * 100) / 100);
  return (
    <div>
      <div className="na-fin-pctls">
        {refs.map((rf, i) => <div key={i} className="na-fin-pctl"><div className="na-fin-pctl-v">{rf.raw}</div><div className="na-fin-pctl-k">{rf.full}</div></div>)}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block' }}>
        {gy.map((g, i) => { const y = padT + ch - (g / pMax) * ch; return <g key={i}><line x1={padL} y1={y} x2={W - padR} y2={y} stroke="rgba(0,0,0,0.06)" /><text x={padL - 4} y={y + 3} textAnchor="end" fontSize={8} fill="var(--text-3)">{Math.round(g * 100)}%</text></g>; })}
        {bands.map((b, i) => { const bh = Math.max(1, (b.p / pMax) * ch); const x = padL + i * bw + 2.5; const y = padT + ch - bh; return <g key={i}>
          <rect x={x} y={y} width={bw - 5} height={bh} rx={1.5} fill="var(--primary)" />
          <text x={x + (bw - 5) / 2} y={H - padB + 11} textAnchor="middle" fontSize={6} fill="var(--text-3)">{shortBand(i)}</text>
        </g>; })}
        {refs.map((rf, i) => { const x = xForVal(rf.valM); return <g key={i}>
          <line x1={x} y1={padT - 3} x2={x} y2={padT + ch} stroke="#DC2626" strokeWidth={1.2} strokeDasharray="3 3" />
          <text x={x + 2} y={padT + 4} fontSize={8} fontWeight="800" fill="#DC2626">{rf.tag}</text>
        </g>; })}
      </svg>
    </div>
  );
}

function FinRevChart({ c }) {
  const t = (c.chartType || '').toLowerCase();
  if (/histogram/.test(t)) return <FinRevHistogram c={c} />;   // check before /line/ ("reference lines")
  if (/donut|pie/.test(t)) return <FinRevDonut c={c} />;
  if (/bubble/.test(t)) return <FinRevBubble c={c} />;
  if (/grouped bar/.test(t)) return <FinRevGroupedBar c={c} />;
  if (/line/.test(t)) return <FinRevLine c={c} />;
  return <FinRevGroupedBar c={c} />;
}

const naUnitOf = (r) => (String(r).match(/%|bps|\$|hours?|hrs?|days?/i) || [''])[0].toLowerCase();
function FinChart({ item }) {
  const viz = naFinViz(item.detail);
  const s = ((item.chartType || '') + ' ' + (item.title || '')).toLowerCase();
  const pr = viz.pairs;
  let kind = 'bars';
  if (/gauge|donut|progress|efficacy/.test(s)) kind = 'gauge';
  else if (/line|area|timeline|gantt|dual|trend|backlog|availab/.test(s)) kind = 'trend';

  if (kind === 'gauge') {
    let value, target = null, unit = '%', valueRaw;
    if (pr.length) { value = pr[0].num; unit = pr[0].unit || '%'; valueRaw = pr[0].raw; if (pr[1]) target = pr[1].num; }
    else if (viz.figures.length) { value = naFinNum(viz.figures[0]); valueRaw = viz.figures[0]; unit = (viz.figures[0].match(/%|bps/) || ['%'])[0]; }
    else { value = 65; valueRaw = '65%'; }
    const max = Math.max(value, target || 0) * 1.5 || 100;
    return <><FinGauge value={value} target={target} unit={unit} valueRaw={valueRaw} max={max} /><FinLegend viz={viz} /></>;
  }
  if (kind === 'trend') {
    const peak = viz.figures[0] || (pr[0] && pr[0].raw) || '';
    const recover = /availab|recover|complaint/.test(s);
    return <><FinTrend peak={peak} shape={recover ? [1, 0.35, 0.2, 0.45, 0.72, 0.9, 1] : [0.12, 0.28, 0.42, 0.6, 0.75, 0.9, 1]} /><FinLegend viz={viz} /></>;
  }
  // bars — keep a single unit so magnitudes are comparable; mold a comparator if only one value.
  let data = [];
  if (pr.length >= 2 && pr.every(p => p.unit === pr[0].unit)) {
    data = pr.map(p => ({ label: naShort(p.label), raw: p.raw, num: p.num }));
  } else {
    let figs = viz.figures;
    if (figs.length) {
      const counts = {}; figs.forEach(r => { const u = naUnitOf(r); counts[u] = (counts[u] || 0) + 1; });
      const dom = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
      figs = figs.filter(r => naUnitOf(r) === dom);
    }
    data = figs.map(r => ({ label: '', raw: r, num: naFinNum(r) }));
  }
  if (data.length === 0) data = [{ label: 'Base', raw: '', num: 40 }, { label: 'Adverse', raw: '', num: 70 }, { label: 'Severe', raw: '', num: 100 }];
  if (data.length === 1) data = [{ label: 'Baseline', raw: '', num: Math.max(1, data[0].num * 0.55) }, { ...data[0], label: data[0].label || 'Stressed' }];
  return <><FinBars data={data.slice(0, 5)} /><FinLegend viz={viz} /></>;
}

// Risk Transmission Map — CME-Exchange-style tiered SVG built from the Excel map
// data: left row labels, dark amber boxes, red L1–L3 bracket, full-width
// Trigger/Limit/Action bars and animated red dotted parent→child connectors,
// revealed tier-by-tier (uses the RtmEdge/RtmLabel helpers defined below).
function NaTransMapCME({ map }) {
  // Group nodes into tier rows, preserving the workbook order.
  const rows = React.useMemo(() => {
    const order = [];
    (map || []).forEach(m => {
      const key = (m.tier || '').trim();
      let r = order.find(x => x.tier.toLowerCase() === key.toLowerCase());
      if (!r) { r = { tier: key, nodes: [] }; order.push(r); }
      r.nodes.push(m);
    });
    return order;
  }, [map]);

  const LX = 150, RX = 1030, USABLE = RX - LX, gap = 12, nodeH = 48, barH = 34, vgap = 40;
  const isBar = (r) => /^(trigger|limit breach|action)/i.test(r.tier) || r.nodes.length === 1;

  // Lay out rows top-to-bottom with node coordinates.
  const laid = [];
  let y = 24;
  rows.forEach(r => {
    const bar = isBar(r), h = bar ? barH : nodeH;
    let nodes;
    if (bar) {
      nodes = [{ ...r.nodes[0], x: LX, y, w: USABLE, h, cx: LX + USABLE / 2, top: y, bottom: y + h, bar: true }];
    } else {
      const N = r.nodes.length, boxW = (USABLE - (N - 1) * gap) / N;
      nodes = r.nodes.map((n, i) => { const x = LX + i * (boxW + gap); return { ...n, x, y, w: boxW, h, cx: x + boxW / 2, top: y, bottom: y + h, bar: false }; });
    }
    laid.push({ tier: r.tier, y, h, bar, nodes });
    y += h + vgap;
  });
  const totalH = y - vgap + 24;

  // Build parent→child edges (parent must be an earlier tier; supports ';' multi-parents).
  // Also index by an alphanumeric-only key so garbled Excel parents like
  // "Netcurrentexposure()" still match "Net current exposure ($)".
  const nk = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const byCard = {}, byTier = {}, byNorm = {};
  laid.forEach((row, ri) => row.nodes.forEach(n => {
    byCard[(n.card || '').trim().toLowerCase()] = { ...n, ri };
    byNorm[nk(n.card)] = { ...n, ri };
    const tk = (row.tier || '').trim().toLowerCase();
    if (!(tk in byTier)) byTier[tk] = { ...n, ri };
  }));
  const edges = [], seen = new Set();
  laid.forEach((row, ri) => row.nodes.forEach(n => {
    if (!n.parent || n.parent === '—') return;
    String(n.parent).split(';').map(p => p.trim()).filter(Boolean).forEach(p => {
      const pn = byCard[p.toLowerCase()] || byTier[p.toLowerCase()] || byNorm[nk(p)];
      if (!pn || pn.ri >= ri) return;
      const key = nk(pn.card) + '>' + nk(n.card) + '@' + ri;
      if (seen.has(key)) return; seen.add(key);   // de-dupe repeated garbled parents
      edges.push({ x1: pn.cx, y1: pn.bottom, x2: n.cx, y2: n.top, childRi: ri });
    });
  }));

  const [phase, setPhase] = React.useState(0);
  React.useEffect(() => {
    setPhase(0);
    const timers = laid.map((_, i) => setTimeout(() => setPhase(i + 1), 350 + i * 600));
    return () => timers.forEach(clearTimeout);
  }, [map]);

  const l1i = laid.findIndex(r => /l1/i.test(r.tier));
  const l3i = laid.findIndex(r => /l3/i.test(r.tier));
  const BOX = { fill: '#241a0e', stroke: '#c8855a', text: '#f0c880' };
  const TRIG = { fill: '#2d1e0c', stroke: '#8B5e30', text: '#ffcf88' };

  const wrap = (text, maxChars) => {
    const words = String(text || '').split(/\s+/); const lines = []; let cur = '';
    words.forEach(w => { if (!cur) cur = w; else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w; else { lines.push(cur); cur = w; } });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  };
  const rowVisible = (ri) => ({ opacity: phase >= ri + 1 ? 1 : 0, transition: 'opacity 0.5s' });

  return (
    <div className="na-rtm-cme">
      <svg viewBox={`0 0 1060 ${totalH}`} preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style={{ width: '100%', height: 'auto', fontFamily: 'inherit' }}>
        {edges.map((e, i) => (
          <g key={i} style={{ opacity: phase >= e.childRi + 1 ? 1 : 0, transition: 'opacity 0.45s' }}>
            <RtmEdge x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} />
          </g>
        ))}
        {l1i >= 0 && l3i >= 0 && (
          <g style={rowVisible(l1i)}>
            <rect x={139} y={laid[l1i].y - 2} width={3} height={(laid[l3i].y + laid[l3i].h) - (laid[l1i].y - 2)} rx={1.5} fill="#c0392b" opacity={0.8} />
          </g>
        )}
        {laid.map((row, ri) => (
          <g key={ri} style={rowVisible(ri)}>
            <RtmLabel x={126} y={row.y + row.h / 2} label={row.tier} />
            {row.nodes.map((n, i) => {
              const sc = row.bar && /trigger/i.test(row.tier) ? TRIG : BOX;
              const fz = row.bar ? 10.5 : 10;
              const maxChars = Math.max(6, Math.floor((n.w - 12) / (fz * 0.55)));
              const lines = wrap(n.card, row.bar ? 130 : maxChars);
              const startY = n.y + n.h / 2 - (lines.length - 1) * (fz * 0.62);
              return (
                <g key={i}>
                  <rect x={n.x} y={n.y} width={n.w} height={n.h} rx={5} fill={sc.fill} stroke={sc.stroke} strokeWidth={1.5} />
                  {lines.map((ln, li) => (
                    <text key={li} x={n.cx} y={startY + li * (fz * 1.25)} textAnchor="middle" dominantBaseline="middle" fontSize={fz} fontWeight="600" fill={sc.text} fontFamily="inherit">{ln}</text>
                  ))}
                </g>
              );
            })}
          </g>
        ))}
      </svg>
    </div>
  );
}

// Risk Transmission Map — dark tiered tree with animated node creation and
// dotted orange parent→child connectors (matches the Excel snapshot).
function NaTransMap({ map }) {
  const containerRef = React.useRef(null);
  const nodeRefs     = React.useRef({});
  const [edges, setEdges] = React.useState([]);
  const [ready, setReady] = React.useState(false);

  const { tiers, nodes, N } = React.useMemo(() => {
    const tiers = []; const nodes = []; let gi = 0;
    (map || []).forEach(m => {
      let t = tiers.find(x => x.tier === m.tier);
      if (!t) { t = { tier:m.tier, nodes:[] }; tiers.push(t); }
      const node = { id:'n'+gi, gi, tier:m.tier, card:m.card, parent:m.parent };
      t.nodes.push(node); nodes.push(node); gi++;
    });
    return { tiers, nodes, N: nodes.length };
  }, [map]);

  const measure = React.useCallback(() => {
    const cont = containerRef.current; if (!cont) return;
    const cr = cont.getBoundingClientRect();
    const byCard = {}, byTier = {};
    nodes.forEach(n => { byCard[n.card.trim().toLowerCase()] = n.id; if (!(n.tier.trim().toLowerCase() in byTier)) byTier[n.tier.trim().toLowerCase()] = n.id; });
    const es = [];
    nodes.forEach(n => {
      if (!n.parent || n.parent === '—') return;
      // A node can list several parents separated by ';' — draw a connector to each.
      const parents = String(n.parent).split(';').map(p => p.trim()).filter(Boolean);
      parents.forEach((p, pi) => {
        const pkey = p.toLowerCase();
        const pid = byCard[pkey] || byTier[pkey];
        const pEl = nodeRefs.current[pid], cEl = nodeRefs.current[n.id];
        if (!pEl || !cEl) return;
        const pr = pEl.getBoundingClientRect(), crc = cEl.getBoundingClientRect();
        es.push({ key: n.id + '-' + pi, x1: pr.left - cr.left + pr.width/2, y1: pr.bottom - cr.top, x2: crc.left - cr.left + crc.width/2, y2: crc.top - cr.top });
      });
    });
    setEdges(es);
  }, [nodes]);

  React.useEffect(() => {
    const t = setTimeout(() => { measure(); setReady(true); }, N * 90 + 500);
    const onResize = () => measure();
    window.addEventListener('resize', onResize);
    let ro; if (window.ResizeObserver && containerRef.current) { ro = new ResizeObserver(() => measure()); ro.observe(containerRef.current); }
    return () => { clearTimeout(t); window.removeEventListener('resize', onResize); if (ro) ro.disconnect(); };
  }, [measure, N]);

  const setRef = (id) => (el) => { if (el) nodeRefs.current[id] = el; };

  return (
    <div className="na-tmap2" ref={containerRef}>
      <svg className="na-tmap2-svg" style={{opacity: ready ? 1 : 0}}>
        {edges.map(e => {
          const my = (e.y1 + e.y2) / 2;
          return <path key={e.key} d={`M ${e.x1} ${e.y1} C ${e.x1} ${my}, ${e.x2} ${my}, ${e.x2} ${e.y2}`} fill="none" stroke="rgba(233,120,45,0.9)" strokeWidth="1.4" strokeDasharray="2 5" strokeLinecap="round" />;
        })}
      </svg>
      {tiers.map((t, ti) => (
        t.nodes.length === 1 ? (
          <div key={ti} className="na-tmap2-bar" ref={setRef(t.nodes[0].id)} style={{animationDelay:(t.nodes[0].gi * 0.09).toFixed(2) + 's'}}>
            <strong>{t.tier}</strong> · {t.nodes[0].card}
          </div>
        ) : (
          <div key={ti} className="na-tmap2-tier">
            <div className={`na-tmap2-lbl ${/l2|l3/i.test(t.tier) ? 'accent' : ''}`}>{t.tier}</div>
            <div className="na-tmap2-row">
              {t.nodes.map(n => (
                <div key={n.id} className="na-tmap2-node" ref={setRef(n.id)} style={{animationDelay:(n.gi * 0.09).toFixed(2) + 's'}}>{n.card}</div>
              ))}
            </div>
          </div>
        )
      ))}
    </div>
  );
}

function NewsAssessment({ onBack }) {
  const [search,     setSearch]     = React.useState('');    // news search box text
  const [searching,  setSearching]  = React.useState(false); // "connecting to internet" state
  const [searched,   setSearched]   = React.useState(false); // results revealed after a search
  const [srcHit,     setSrcHit]     = React.useState(0);     // animated source counter
  const [phase,      setPhase]      = React.useState('select'); // select | running | results
  const [runId,      setRunId]      = React.useState(null);   // event being assessed
  const [stepIdx,     setStepIdx]     = React.useState(0);    // step index within the active agent
  const [activeAgent, setActiveAgent] = React.useState(0);    // current agent tab (0–3)
  const [agentStatus, setAgentStatus] = React.useState(['locked','locked','locked','locked','locked']); // locked | processing | ready | done
  const [actionTab,  setActionTab]  = React.useState('immediate');
  const [openAct,    setOpenAct]    = React.useState(null);
  const [openFlow,   setOpenFlow]   = React.useState(null);
  const [openQuant,  setOpenQuant]  = React.useState(null);
  const [hitl,       setHitl]       = React.useState(null);  // null | approved | rejected | sent
  const [hitlComment,setHitlComment]= React.useState('');
  const [chat,       setChat]       = React.useState([]);
  const [chatInput,  setChatInput]  = React.useState('');
  const [chatOpen,   setChatOpen]   = React.useState(false); // floating chatbot open
  const [printAll,   setPrintAll]   = React.useState(false); // render all agent sections for PDF export
  const [metricOff,  setMetricOff]  = React.useState({});    // unchecked impact metrics (key -> true)
  const [stripeOff,  setStripeOff]  = React.useState({});    // unchecked risk stripes (key -> true)
  const [customFO,   setCustomFO]   = React.useState([]);    // user-added first-order stripes
  const [customSO,   setCustomSO]   = React.useState([]);    // user-added second-order stripes
  const [addForm,    setAddForm]    = React.useState(null);  // {section, stripe, metric, impact, sev}
  const [homeFilter, setHomeFilter] = React.useState('all'); // Home feed severity filter
  const [impactOpen, setImpactOpen] = React.useState({});    // expanded impact per stripe (key -> true)
  const [selectedHome, setSelectedHome] = React.useState(null); // home feed article shown in the middle
  const [finZoom, setFinZoom] = React.useState(null);        // financial chart opened in the enlarge modal

  const exportPdf = () => {
    setPrintAll(true);
    setTimeout(() => { window.print(); setPrintAll(false); }, 200);
  };

  // Run one agent's 4 steps sequentially — no step starts before the previous finishes.
  const startAgent = (i) => {
    setActiveAgent(i);
    setStepIdx(0);
    setAgentStatus(prev => prev.map((s, idx) => idx === i ? 'processing' : s));
    const steps = NA_AGENTS[i].steps;
    const nSteps = steps.length;
    // How long step `k` is shown before advancing — a per-step `ms` override wins,
    // otherwise a randomised duration (occasionally slower, for a "live" feel).
    const stepMs = (k) => (steps[k] && steps[k].ms) ? steps[k].ms
      : 700 + Math.random() * 600 + (Math.random() < 0.3 ? 700 + Math.random() * 900 : 0);
    let s = 0;
    const tick = () => {
      s += 1;
      setStepIdx(s);
      if (s < nSteps) {
        setTimeout(tick, stepMs(s));
      } else {
        setTimeout(() => setAgentStatus(prev => prev.map((st, idx) => idx === i ? 'done' : st)), 700);
      }
    };
    setTimeout(tick, (steps[0] && steps[0].ms) ? steps[0].ms : 500);
  };
  const genOutput    = (i) => setAgentStatus(prev => prev.map((st, idx) => idx === i ? 'done' : st));
  const continueNext = (i) => { if (i < NA_AGENTS.length - 1) startAgent(i + 1); };

  const runAssessment = (id) => {
    setRunId(id);
    setPhase('assess');
    setActionTab('immediate'); setOpenAct(null); setOpenFlow(null); setOpenQuant(null);
    setHitl(null); setHitlComment(''); setChat([]); setChatInput(''); setChatOpen(false);
    setMetricOff({}); setStripeOff({}); setCustomFO([]); setCustomSO([]); setAddForm(null); setImpactOpen({}); setFinZoom(null);
    setAgentStatus(['locked','locked','locked','locked','locked']);
    startAgent(0);
  };

  const backToSelect = () => { setPhase('select'); setRunId(null); setSearched(false); setSearching(false); };

  const askChat = (q) => {
    const item = NA_FEED.find(f => f.id === runId);
    const d = NA_DATA[item.dataId];
    const a3x = (typeof NA_A3 !== 'undefined' && NA_A3[item.dataId]) || {};
    const qa = (a3x.chatbot && a3x.chatbot.length) ? a3x.chatbot : d.chatbot;
    const hit = qa.find(c => c.q === q) ||
      qa.reduce((best, c) => {
        const overlap = q.toLowerCase().split(/\s+/).filter(w => w.length > 3 && c.q.toLowerCase().includes(w)).length;
        return overlap > (best._o || 0) ? { ...c, _o:overlap } : best;
      }, { _o:0 });
    const answer = hit && hit.a ? hit.a : d.reportSummary;
    // Show the question + a typing indicator, then reveal the answer after ~7s.
    setChat(prev => [...prev, { role:'user', text:q }, { role:'bot', text:'', typing:true }]);
    setChatInput('');
    setTimeout(() => {
      setChat(prev => {
        const cp = [...prev];
        for (let i = cp.length - 1; i >= 0; i--) { if (cp[i].role === 'bot' && cp[i].typing) { cp[i] = { role:'bot', text:answer }; break; } }
        return cp;
      });
    }, 7000);
  };

  const SectionHeader = ({ letter, title }) => (
    <div className="scenario-section-header"><span className="section-letter">{letter}</span>{title}</div>
  );

  // ── SELECT phase ──────────────────────────────────────────────────────────

    const toks = q.split(/\s+/).filter(w => w.length > 2);
    // Relevance score: full-phrase and title matches weigh most, so a longer
    // phrase like "ransomware halts payment" ranks the right event first.
    const score = (ev) => {
      if (!q) return 1;
      const title = ev.title.toLowerCase();
      const hay = (ev.title + ' ' + ev.type + ' ' + ev.synopsis).toLowerCase();
      let s = 0;
      if (title.includes(q)) s += 12;           // full phrase in title
      else if (hay.includes(q)) s += 8;         // full phrase anywhere
      toks.forEach(w => { if (title.includes(w)) s += 3; else if (hay.includes(w)) s += 1; });
      return s;
    };
    const filtered = q
      ? NA_FEED.map(ev => ({ ev, s: score(ev) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 8).map(x => x.ev)
      : NA_FEED;
    const SRC_LIST = ['Reuters','Bloomberg','Financial Times','WSJ','Dow Jones Newswire','S&P Global','Regulatory wires','Central bank feeds'];
    const doSearch = () => {

        if (i < SRC_LIST.length) setTimeout(tick, 620 + Math.random() * 340);

      };
      setTimeout(tick, 500);

    const onType = (v) => { setSearch(v); setSearched(false); setSelectedHome(null); };
    const hl = (text) => {
      if (!q) return text;

      return <>{text.slice(0, idx)}<span className="na-feed-hl">{text.slice(idx, idx + needle.length)}</span>{text.slice(idx + needle.length)}</>;
    };

    // Home Page live feed — sorted by severity, filterable

              ) : (

            <i className="fa-solid fa-globe" style={{fontSize:20,color:'var(--primary)',marginBottom:10,display:'block'}}></i>

          </div>

        </div>{/* /ni-right */}
        </div>{/* /ni-landing */}
      </div>
    );
